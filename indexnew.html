<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invoice Tracker — Leon Electricians Ltd</title>
<style>
:root{
  --navy:#0b1b33;
  --navy2:#132a4c;
  --yellow:#f3c623;
  --bg:#eef1f6;
  --line:#dde3ec;
  --ink:#101827;
  --mute:#6b7280;
  --green:#15803d;
  --amber:#b45309;
  --red:#b91c1c;
  --blue:#1d4ed8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* header */
.hdr{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:60}
.hdr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1080px;margin:auto}
.hdr h1{font-size:17px;color:var(--yellow);font-weight:800;letter-spacing:.2px}
.hdr .sub{font-size:11px;color:#a8bcd8;margin-top:1px}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#a8bcd8;background:#ffffff14;border-radius:999px;padding:5px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e88;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e77}70%{box-shadow:0 0 0 7px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.nav{display:flex;gap:6px;margin-top:10px;max-width:1080px;margin-left:auto;margin-right:auto}
.nbtn{background:transparent;border:1.5px solid #ffffff33;color:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer}
.nbtn.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.mini{background:#ffffff14;border:1.5px solid #ffffff26;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.mini:active{opacity:.7}

/* layout */
.wrap{max-width:1080px;margin:auto;padding:14px 12px 80px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-bottom:12px}
.crumb a{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
h2.page{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:2px}
p.page{font-size:13px;color:var(--mute);margin-bottom:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.stat .v{font-size:20px;font-weight:800;margin-top:5px;color:var(--navy)}
.stat.paid .v{color:var(--green)}
.stat.out .v{color:var(--red)}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}
.sec h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--navy)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0b1b3314}
.card .cname{font-size:16px;font-weight:800;color:var(--navy);padding-right:62px}
.card .crow{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--mute)}
.card .crow b{color:var(--ink);font-weight:700}
.bar{height:6px;border-radius:999px;background:#eef1f6;margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green)}
.xbtn{position:absolute;top:9px;right:9px;background:#f3f4f6;border:0;border-radius:7px;width:26px;height:26px;font-size:13px;color:var(--mute);cursor:pointer;line-height:1}
.xbtn:hover{background:#fee2e2;color:var(--red)}
.xbtn.ren{right:41px}
.xbtn.ren:hover{background:#dbeafe;color:var(--blue)}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer}
.mcard.empty{opacity:.55}
.mcard:hover{border-color:var(--navy)}
.mcard .mn{font-size:14px;font-weight:800;color:var(--navy)}
.mcard .mv{font-size:17px;font-weight:800;margin-top:4px}
.mcard .ms{font-size:11px;color:var(--mute);margin-top:3px}

.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fafc}
.row .rmain{flex:1;min-width:0}
.row .rt{font-weight:700;font-size:14px;color:var(--navy)}
.row .rs{font-size:12px;color:var(--mute);margin-top:3px}
.row .ramt{font-weight:800;font-size:15px;white-space:nowrap}
.chev{color:#c3cbd8;font-weight:800}

.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.p-paid{background:#dcfce7;color:var(--green)}
.p-part{background:#fef3c7;color:var(--amber)}
.p-pend{background:#dbeafe;color:var(--blue)}
.p-unpaid{background:#fee2e2;color:var(--red)}
.p-none{background:#f1f5f9;color:var(--mute)}

table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:var(--navy);color:var(--yellow);text-align:left;padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:#f8fafc;font-weight:800;border-top:2px solid var(--navy)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.num{text-align:right;white-space:nowrap}
.tiny{background:#f3f4f6;border:0;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer;margin-left:4px}
.tiny:hover{background:#e5e7eb;color:var(--ink)}
.tiny.del:hover{background:#fee2e2;color:var(--red)}

.btn{border:0;border-radius:9px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.75}
.b-primary{background:var(--navy);color:#fff}
.b-yellow{background:var(--yellow);color:var(--navy)}
.b-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.b-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca}

.empty-state{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:34px 18px;text-align:center;color:var(--mute)}
.empty-state b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}

/* modal */
.mbg{display:none;position:fixed;inset:0;background:#0b1b33cc;z-index:200;align-items:flex-end;justify-content:center;padding:0}
.mbg.on{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;padding:18px 16px 26px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mhead h4{font-size:16px;font-weight:800;color:var(--navy)}
.f{margin-bottom:11px}
.f label{display:block;font-size:12px;font-weight:800;color:#374151;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hintline{font-size:12px;color:var(--mute);margin-top:-4px;margin-bottom:10px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:900;transition:transform .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}

body.ro .editable{display:none!important}
.rep{background:#fee2e2;color:var(--red);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;margin-left:6px;white-space:nowrap}
.dupbox{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:10px;padding:12px;margin-bottom:10px}
.dupbox .dt{font-size:13px;font-weight:800;color:var(--amber);margin-bottom:4px}
.dupbox .dl{font-size:12px;color:#7c2d12;margin-bottom:8px;line-height:1.5}
.dupbox .btn{padding:7px 13px;font-size:12px;margin-right:6px}
.dupbox.done{background:#f0fdf4;border-color:#bbf7d0}
.dupbox.done .dt{color:var(--green)}
.gl{display:flex;align-items:flex-start;gap:9px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.gl:last-child{border-bottom:0}
.gl input{width:18px;height:18px;margin-top:2px;flex-shrink:0}
.gl .ga{flex:1;min-width:0}
.gl .gv{font-weight:800;white-space:nowrap}
.gl.off{opacity:.45}
.gtot{display:flex;justify-content:space-between;padding:12px 4px;font-size:16px;font-weight:800;color:var(--navy);border-top:2px solid var(--navy);margin-top:4px}

/* printable invoice */
#printarea{display:none}
.doc{font-size:13px;color:#111}
.doc .lh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
.doc .co{font-size:19px;font-weight:800;color:var(--navy)}
.doc .cd{font-size:11px;color:#555;line-height:1.6;margin-top:4px}
.doc .it{text-align:right}
.doc .it .ti{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:1px}
.doc .it .tn{font-size:12px;line-height:1.7;margin-top:4px}
.doc .to{margin-bottom:14px;font-size:12px;line-height:1.6}
.doc table{width:100%;border-collapse:collapse;font-size:12px}
.doc th{background:var(--navy);color:#fff;padding:8px;text-align:left;font-size:11px}
.doc td{border-bottom:1px solid #ddd;padding:7px 8px}
.doc .tr{text-align:right}
.doc .tot td{border-top:2px solid var(--navy);border-bottom:0;font-weight:800;font-size:15px;padding-top:10px}
.doc .ft{margin-top:22px;padding-top:12px;border-top:1px solid #ddd;font-size:10px;color:#666;line-height:1.7}
@media print{
  body>*:not(#printarea){display:none!important}
  #printarea{display:block!important}
  @page{margin:14mm}
}


/* codes */
.modal.wide{max-width:1040px}
.mute{color:var(--mute);font-size:12px}
.stats.s3{grid-template-columns:repeat(3,1fr)}
.cmhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.cmhead .mute{margin-top:3px}
.ctab{font-size:12px}
.ctab td{padding:7px 8px;vertical-align:middle}
.ctab .kd{min-width:160px}
.ctab input.cm-in,.ctab select.cm-in{padding:6px 7px;border:1.5px solid var(--line);border-radius:7px;background:#fff;font-size:12px}
.ctab input.qn{width:64px;text-align:right}
.ctab input.rn{width:80px;text-align:right}
.ctab input.cmt{width:100%;min-width:130px}
select.dec{font-weight:800}
select.d-Approved{background:#dcfce7!important;color:var(--green)}
select.d-Amended{background:#fef3c7!important;color:var(--amber)}
select.d-Removed{background:#fee2e2!important;color:var(--red)}
select.d-Pending{background:#dbeafe!important;color:var(--blue)}
span.dec-pill{border-radius:7px;padding:5px 9px}
span.d-Approved{background:#dcfce7;color:var(--green)}
span.d-Amended{background:#fef3c7;color:var(--amber)}
span.d-Removed{background:#fee2e2;color:var(--red)}
span.d-Pending{background:#dbeafe;color:var(--blue)}
span.d-Notinvoiced{background:#f1f5f9;color:var(--mute)}
select.d-Notinvoiced{background:#f1f5f9!important;color:var(--mute)}
tr.k-Notinvoiced td{color:var(--mute)}
tr.k-Removed td.kd,tr.k-Removed td:first-child{text-decoration:line-through;color:var(--red)}
.addrow{display:grid;grid-template-columns:110px 1fr 80px 95px auto;gap:8px}
.addrow input{padding:10px;border:1.5px solid var(--line);border-radius:9px}
details.paste{margin-top:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.paste summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--navy)}
details.paste textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.cmprop{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
.cmph{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.cmamt s{color:var(--mute)}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.codecell{margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.codecell .pill{cursor:pointer}
.chg{font-size:11px;color:var(--red);font-weight:700}
body.ro .cm-in{pointer-events:none;opacity:.75}

@media(max-width:640px){
  .addrow{grid-template-columns:1fr 1fr}
  .stats.s3{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .f2{grid-template-columns:1fr}
  .hdr h1{font-size:15px}
}
</style>

<body>

<div id="toast"></div>
<div id="printarea"></div>

<div id="shell">
<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>⚡ INVOICE TRACKER</h1>
      <div class="sub">Leon Electricians Ltd — weekly income &amp; invoice status</div>
    </div>
    <div class="spacer"></div>
    <div class="live"><span class="dot"></span><span id="synced">Connecting…</span></div>
    <button class="mini" id="robtn" onclick="toggleRO()">View only: off</button>
  </div>
  <div class="nav">
    <button class="nbtn on" id="nav-dash" onclick="go({view:'home'})">Contractors</button>
    <button class="nbtn" id="nav-inv" onclick="go({view:'invoices'})">All invoices</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="empty-state"><b>Loading your records…</b>One moment.</div>
</div>

<div class="mbg" id="mbg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead"><h4 id="mtitle">Edit</h4><button class="btn b-ghost" style="padding:7px 12px" onclick="closeModal()">Close</button></div>
    <div id="mbody"></div>
  </div>
</div>
</div>

<script>
/* ─────────────────────── Firebase connection ─────────────────────── */
var firebaseConfig = {
  apiKey: "AIzaSyDQu3EBjsp4pEBqLWu0gMjxFtqQRgkB3hw",
  authDomain: "leon-invoice-tracker.firebaseapp.com",
  databaseURL: "https://leon-invoice-tracker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "leon-invoice-tracker",
  storageBucket: "leon-invoice-tracker.firebasestorage.app",
  messagingSenderId: "581901171052",
  appId: "1:581901171052:web:03e871c58de1c76d3fdb49"
};
var FB_OK = (typeof firebase !== 'undefined' && firebase.initializeApp);
var auth = null, rtdb = null;
if(FB_OK){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  rtdb = firebase.database();
}

var DB  = {contractors:[], entries:[], invoices:[], minvoices:[]};
var route = {view:'home'};
var modalOpen = false, pendingRender = false, seedTried = false;

var DEFAULT_CONTRACTORS = ['Peabody','Morgan & Sindall','PGM / B&X Construction','XPRT / MTS'];
var STATUSES = ['Pending','Unpaid','Partially Paid','Paid'];

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* every record lives at its own path, so two people editing at once
   change different records instead of overwriting each other's work */
function ref(path){ return rtdb.ref(path); }

function save(path, value, msg){
  return ref(path).set(value)
    .then(function(){ if(msg) toast(msg); })
    .catch(function(){ toast('Could not save — check your connection'); });
}
function wipe(path){
  return ref(path).remove().catch(function(){ toast('Could not delete — check your connection'); });
}
function applyUpdate(map, msg){
  return rtdb.ref().update(map)
    .then(function(){ if(msg) toast(msg); })
    .catch(function(){ toast('Could not save — check your connection'); });
}

function mapToList(obj){
  if(!obj) return [];
  return Object.keys(obj).map(function(k){
    var v = obj[k] || {};
    v.id = k;
    return v;
  });
}

function watchData(){
  ref('/').on('value', function(snap){
    var v = snap.val() || {};
    DB.contractors = mapToList(v.contractors);
    DB.entries     = mapToList(v.entries);
    DB.invoices    = mapToList(v.invoices);
    DB.minvoices   = mapToList(v.minvoices);
    stamp();
    if(modalOpen){ pendingRender = true; if(CM) renderCM(); } else { render(); }
    seedIfEmpty(v);
  }, function(){
    document.getElementById('synced').textContent = 'No access — check your rules';
  });
}

/* first person in gets the four contractors; the transaction stops
   two devices seeding duplicates at the same time */
function seedIfEmpty(v){
  if(seedTried || (v && v.contractors) || (v && v.meta && v.meta.seeded)) return;
  seedTried = true;
  ref('meta/seeded').transaction(function(cur){ return cur ? undefined : true; }, function(err, committed){
    if(err || !committed) return;
    var map = {};
    DEFAULT_CONTRACTORS.forEach(function(nm){ map['contractors/'+uid('c')] = {name:nm}; });
    applyUpdate(map);
  });
}

function stamp(){
  var t = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('synced').textContent = 'Live · ' + t;
}

/* ─────────────────────────── helpers ─────────────────────────── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function n(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function fmt(v){return '£'+n(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtShort(v){return '£'+Math.round(n(v)).toLocaleString('en-GB');}

function isoOf(d){var p=function(x){return String(x).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function today(){return isoOf(new Date());}
function mondayOf(iso){
  var d=new Date(iso+'T12:00:00');
  var off=(d.getDay()+6)%7;      // Mon=0 … Sun=6
  d.setDate(d.getDate()-off);
  return isoOf(d);
}
function addDays(iso,k){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+k);return isoOf(d);}
function uk(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB');}
function ukShort(iso){var d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function monthEnd(mk){var q=mk.split('-');return isoOf(new Date(+q[0],+q[1],0,12));}
/* A week never crosses a month boundary. It runs Monday to Sunday, but the
   first week of a month starts on the 1st and the last one stops on the last
   day — so the weeks of a month always add up to exactly that month. */
function weekStartFor(iso){
  var m = mondayOf(iso), first = iso.slice(0,8)+'01';
  return m < first ? first : m;
}
function weekEndFor(ws){
  var sunday = addDays(mondayOf(ws),6), last = monthEnd(ws.slice(0,7));
  return sunday < last ? sunday : last;
}
function weekLabel(w){return ukShort(w)+' – '+uk(weekEndFor(w));}
function monthOfWeek(w){return w.slice(0,7);}
function monthName(mk){var p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long'});}
function monthFull(mk){var p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}

/* the 1st of the month, then every Monday after it */
function weeksInMonth(mk){
  var q=mk.split('-'), y=+q[0], m=+q[1];
  var out=[mk+'-01'];
  var d=new Date(y,m-1,1,12);
  while(d.getMonth()===m-1){
    if(d.getDay()===1 && d.getDate()!==1) out.push(isoOf(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

function contractor(id){ for(var i=0;i<DB.contractors.length;i++) if(DB.contractors[i].id===id) return DB.contractors[i]; return null; }
function entriesFor(cid,week,mk){
  return DB.entries.filter(function(e){
    if(cid && e.contractorId!==cid) return false;
    var w = weekStartFor(e.date);
    if(week && w!==week) return false;
    if(mk && monthOfWeek(w)!==mk) return false;
    return true;
  });
}
function invoicesFor(cid,week,mk){
  return DB.invoices.filter(function(v){
    if(cid && v.contractorId!==cid) return false;
    if(week && v.week!==week) return false;
    if(mk && monthOfWeek(v.week)!==mk) return false;
    return true;
  });
}
function monthInvoicesFor(cid,mk){
  return DB.minvoices.filter(function(v){
    if(cid && v.contractorId!==cid) return false;
    if(mk && v.month!==mk) return false;
    return true;
  });
}
/* weekly and monthly invoices side by side, each tagged with its type */
function invRows(cid,mk){
  var out=[];
  invoicesFor(cid,null,mk).forEach(function(v){ out.push({r:v,type:'Weekly',period:weekLabel(v.week),mk:monthOfWeek(v.week)}); });
  monthInvoicesFor(cid,mk).forEach(function(v){ out.push({r:v,type:'Monthly',period:monthFull(v.month),mk:v.month}); });
  return out;
}
function rowsTotal(rows){return sum(rows,function(x){return x.r.amount;});}
function rowsPaid(rows){return sum(rows,function(x){return invPaid(x.r);});}

/* a repeat = same address AND same price inside the same month */
function dupKey(e){ return String(e.address||'').toLowerCase().replace(/[^a-z0-9]/g,'') + '|' + n(e.amount).toFixed(2); }
function dupGroups(list){
  var m={}, out=[];
  list.forEach(function(e){ var k=dupKey(e); (m[k]=m[k]||[]).push(e); });
  Object.keys(m).forEach(function(k){ if(m[k].length>1) out.push({key:k, items:m[k]}); });
  return out;
}
function dupIds(list){
  var ids={};
  dupGroups(list).forEach(function(g){ g.items.forEach(function(e){ ids[e.id]=true; }); });
  return ids;
}

function sum(arr,f){var t=0;for(var i=0;i<arr.length;i++)t+=n(f(arr[i]));return t;}
function worksValue(list){return sum(list,function(e){return e.amount;});}
function invPaid(v){ return v.status==='Paid' ? n(v.amount) : (v.status==='Partially Paid' ? n(v.paid) : 0); }
function invOutstanding(v){ return Math.max(0, n(v.amount) - invPaid(v)); }
function statusClass(s){return s==='Paid'?'p-paid':s==='Partially Paid'?'p-part':s==='Unpaid'?'p-unpaid':'p-pend';}

function yearsAvailable(){
  var set = {}; set[String(new Date().getFullYear())] = 1;
  DB.entries.forEach(function(e){ set[e.date.slice(0,4)]=1; });
  DB.invoices.forEach(function(v){ set[v.week.slice(0,4)]=1; });
  return Object.keys(set).sort();
}

/* ─────────────────────────── routing ─────────────────────────── */
function go(r){ route = r; window.scrollTo(0,0); render(); }

function render(){
  document.getElementById('nav-dash').className = 'nbtn' + (route.view!=='invoices'?' on':'');
  document.getElementById('nav-inv').className  = 'nbtn' + (route.view==='invoices'?' on':'');
  var el = document.getElementById('app');
  if(route.view==='home')            el.innerHTML = viewHome();
  else if(route.view==='contractor') el.innerHTML = viewContractor();
  else if(route.view==='month')      el.innerHTML = viewMonth();
  else if(route.view==='week')       el.innerHTML = viewWeek();
  else if(route.view==='invoices')   el.innerHTML = viewInvoices();
}

function crumbs(parts){
  var h='<div class="crumb">';
  for(var i=0;i<parts.length;i++){
    if(i) h+='<span>›</span>';
    h += parts[i].go ? '<a onclick=\'go('+JSON.stringify(parts[i].go)+')\'>'+esc(parts[i].t)+'</a>'
                     : '<span>'+esc(parts[i].t)+'</span>';
  }
  return h+'</div>';
}

/* ─────────────────────────── views ─────────────────────────── */
function viewHome(){
  var thisMonth = today().slice(0,7);
  var allWorks = worksValue(DB.entries);
  var allRows  = invRows(null,null);
  var invoiced = rowsTotal(allRows);
  var paid     = rowsPaid(allRows);
  var out      = invoiced - paid;

  var h = '<h2 class="page">Contractors</h2><p class="page">Open a contractor to see the month, then the week, then every property.</p>';
  h += '<div class="stats">'+
        stat('Works logged', fmtShort(allWorks), '') +
        stat('Invoiced', fmtShort(invoiced), '') +
        stat('Paid', fmtShort(paid), 'paid') +
        stat('Outstanding', fmtShort(out), 'out') +
       '</div>';

  h += '<div class="sec"><h3>Your contractors</h3><button class="btn b-primary editable" onclick="addContractor()">+ Add contractor</button></div>';

  if(!DB.contractors.length){
    h += '<div class="empty-state"><b>No contractors yet</b>Add your first one to start logging weekly work.</div>';
    return h;
  }

  h += '<div class="grid">';
  DB.contractors.forEach(function(c){
    var mine = DB.entries.filter(function(e){return e.contractorId===c.id;});
    var month = mine.filter(function(e){return e.date.slice(0,7)===thisMonth;});
    var vs = invRows(c.id,null);
    var inv = rowsTotal(vs);
    var pd  = rowsPaid(vs);
    var pct = inv>0 ? Math.round(pd/inv*100) : 0;
    h += '<div class="card" onclick="go({view:\'contractor\',cid:\''+c.id+'\'})">'+
      '<button class="xbtn ren editable" onclick="event.stopPropagation();renameContractor(\''+c.id+'\')" title="Rename contractor">✎</button>'+
      '<button class="xbtn editable" onclick="event.stopPropagation();delContractor(\''+c.id+'\')" title="Remove contractor">✕</button>'+
      '<div class="cname">'+esc(c.name)+'</div>'+
      '<div class="crow"><span>'+monthFull(thisMonth)+'</span><b>'+fmt(worksValue(month))+'</b></div>'+
      '<div class="crow"><span>Invoiced (all time)</span><b>'+fmt(inv)+'</b></div>'+
      '<div class="crow"><span>Outstanding</span><b style="color:'+(inv-pd>0?'var(--red)':'var(--green)')+'">'+fmt(inv-pd)+'</b></div>'+
      '<div class="bar"><span style="width:'+pct+'%"></span></div>'+
      '<div class="crow" style="margin-top:6px"><span>'+pct+'% of invoices settled</span><span class="chev">›</span></div>'+
    '</div>';
  });
  h += '</div>';
  return h;
}
function stat(k,v,cls){return '<div class="stat '+cls+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';}

function viewContractor(){
  var c = contractor(route.cid);
  if(!c) return '<div class="empty-state"><b>That contractor was removed</b><a onclick="go({view:\'home\'})">Back to contractors</a></div>';
  var years = yearsAvailable();
  var yr = route.year || String(new Date().getFullYear());

  var h = crumbs([{t:'Contractors',go:{view:'home'}},{t:c.name}]);
  h += '<h2 class="page">'+esc(c.name)+'</h2><p class="page">Each month shows the value of works logged and what is still owed.</p>';

  var yearMonths = [];
  for(var m=1;m<=12;m++) yearMonths.push(yr+'-'+String(m).padStart(2,'0'));
  var yWorks = worksValue(DB.entries.filter(function(e){return e.contractorId===c.id && e.date.slice(0,4)===yr;}));
  var yInv = invRows(c.id,null).filter(function(x){return x.mk.slice(0,4)===yr;});
  var yInvT = rowsTotal(yInv);
  var yPaid = rowsPaid(yInv);

  h += '<div class="stats">'+
        stat(yr+' works', fmtShort(yWorks),'')+
        stat(yr+' invoiced', fmtShort(yInvT),'')+
        stat(yr+' paid', fmtShort(yPaid),'paid')+
        stat(yr+' outstanding', fmtShort(yInvT-yPaid),'out')+
       '</div>';

  h += '<div class="sec"><h3>Months</h3><select style="padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);font-weight:700" onchange="go({view:\'contractor\',cid:\''+c.id+'\',year:this.value})">';
  years.forEach(function(y){ h += '<option'+(y===yr?' selected':'')+'>'+y+'</option>'; });
  if(years.indexOf(yr)===-1) h += '<option selected>'+yr+'</option>';
  h += '</select></div>';

  h += '<div class="months">';
  yearMonths.forEach(function(mk){
    var es = entriesFor(c.id,null,mk);
    var vs = invRows(c.id,mk);
    var owed = rowsTotal(vs) - rowsPaid(vs);
    h += '<div class="mcard'+(es.length?'':' empty')+'" onclick="go({view:\'month\',cid:\''+c.id+'\',mk:\''+mk+'\'})">'+
      '<div class="mn">'+monthName(mk)+'</div>'+
      '<div class="mv">'+fmt(worksValue(es))+'</div>'+
      '<div class="ms">'+es.length+' propert'+(es.length===1?'y':'ies')+' · '+weeksInMonth(mk).length+' weeks'+
        (owed>0?' · <span style="color:var(--red);font-weight:800">'+fmtShort(owed)+' owed</span>':'')+'</div>'+
    '</div>';
  });
  h += '</div>';
  return h;
}

/* ─────────────────────────── modals ─────────────────────────── */
function openModal(title, body){
  document.querySelector('.modal').classList.remove('wide');
  document.getElementById('mtitle').textContent = title;
  document.getElementById('mbody').innerHTML = body;
  document.getElementById('mbg').className = 'mbg on';
  modalOpen = true;
}
function closeModal(){ CM=null; document.getElementById('mbg').className='mbg'; modalOpen=false; if(pendingRender){pendingRender=false;render();} }
function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}

function addContractor(){
  openModal('Add contractor',
    '<div class="f"><label>Contractor name</label><input id="i-cname" placeholder="e.g. Ealing Council" autofocus></div>'+
    '<button class="btn b-primary" style="width:100%" onclick="saveContractor()">Add contractor</button>');

function saveContractor(){
  var nm = val('i-cname');
  if(!nm){toast('Give the contractor a name first');return;}
  closeModal();
  save('contractors/'+uid('c'), {name:nm}, nm+' added');
}
function renameContractor(id){
  var c = contractor(id); if(!c) return;
  openModal('Rename contractor',
    '<div class="f"><label>Contractor name</label><input id="i-cname" value="'+esc(c.name)+'"></div>'+
    '<div class="hintline">All weeks, properties and invoices under this contractor stay exactly where they are.</div>'+
    '<button class="btn b-primary" style="width:100%" onclick="saveRename(\''+id+'\')">Save name</button>');
}
function saveRename(id){
  var nm = val('i-cname');
  if(!nm){toast('Give the contractor a name first');return;}
  closeModal();
  save('contractors/'+id+'/name', nm, 'Name updated');
}

function delContractor(id){
  var c = contractor(id); if(!c) return;
  var count = DB.entries.filter(function(e){return e.contractorId===id;}).length;
  if(!confirm('Remove '+c.name+'? This also removes '+count+' property record(s) and their invoices. You can undo it straight after.')) return;
  var backup = {
    contractor: JSON.parse(JSON.stringify(c)),
    entries: JSON.parse(JSON.stringify(DB.entries.filter(function(x){return x.contractorId===id;}))),
    invoices: JSON.parse(JSON.stringify(DB.invoices.filter(function(x){return x.contractorId===id;})))
  };
  if(route.cid===id) route = {view:'home'};
  var del = {}; del['contractors/'+id] = null;
  backup.entries.forEach(function(e){ del['entries/'+e.id] = null; });

var GEN = null;

function openGen(cid,mk){
  var es = entriesFor(cid,null,mk).sort(function(a,b){return a.date<b.date?-1:1;});
  if(!es.length){ toast('No properties logged for this month yet'); return; }
  var groups = dupGroups(es);
  var gi = {};
  groups.forEach(function(g,i){ g.items.forEach(function(e){ gi[e.id]=i; }); });
  GEN = {
    cid: cid, mk: mk, editing: null,
    lines: es.map(function(e){
      return {id:e.id, address:e.address, date:e.date, ref:e.ref||'', desc:e.desc||'',
              amount:n(e.amount), include:true, group:(gi[e.id]===undefined?-1:gi[e.id])};
    }),
    groups: groups.map(function(g){ return {addr:g.items[0].address, amount:n(g.items[0].amount), count:g.items.length, answer:null}; })
  };
  openModal('Generate monthly invoice', '<div id="genbody"></div>');
  renderGen();
}

function renderGen(){
  var g = GEN, unanswered = 0;
  var h = '<div class="f2"><div class="f"><label>Invoice number</label><input id="i-mnum" value="'+esc(g.number||'')+'" placeholder="Your own reference" oninput="GEN.number=this.value"></div>'+

          '<div class="f"><label>Status</label><select id="i-mstat">'+
            STATUSES.map(function(st){return '<option'+((g.status||'Pending')===st?' selected':'')+'>'+st+'</option>';}).join('')+
          '</select></div>';

  g.groups.forEach(function(gr,i){
    if(gr.answer===null) unanswered++;
    h += '<div class="dupbox'+(gr.answer?' done':'')+'">'+
      '<div class="dt">'+(gr.answer?'✓ Repeat handled':'⚠ Possible repeat')+'</div>'+
      '<div class="dl"><b>'+esc(gr.addr)+'</b> appears '+gr.count+' times this month at the same price of '+fmt(gr.amount)+'.'+
      (gr.answer==='keep' ? ' Billing all '+gr.count+'.' : gr.answer==='remove' ? ' Billing it once only.' : ' Do you still want to bill it more than once?')+'</div>'+
      (gr.answer ? '<button class="btn b-ghost" onclick="answerDup('+i+',null)">Change answer</button>'
                 : '<button class="btn b-primary" onclick="answerDup('+i+',\'keep\')">Yes, bill them all</button>'+
                   '<button class="btn b-danger" onclick="answerDup('+i+',\'remove\')">No, bill it once</button>')+
    '</div>';
  });

  h += '<div class="sec"><h3>Properties on this invoice</h3><span style="font-size:12px;color:var(--mute)">Untick to leave one off</span></div>';
  var total = 0;
  g.lines.forEach(function(l,i){
    if(l.include) total += l.amount;
    h += '<div class="gl'+(l.include?'':' off')+'">'+
      '<input type="checkbox" '+(l.include?'checked':'')+' onchange="toggleGenLine('+i+')">'+
      '<div class="ga"><b>'+esc(l.address)+'</b>'+(l.group>-1?'<span class="rep">REPEATED</span>':'')+
      '<div style="font-size:11px;color:var(--mute);margin-top:2px">'+uk(l.date)+(l.ref?' · '+esc(l.ref):'')+' '+codeChip(findEntry(l.id))+'</div></div>'+
      '<div class="gv">'+fmt(l.amount)+'</div></div>';
  });
  h += '<div class="gtot"><span>Invoice total</span><span>'+fmt(total)+'</span></div>';

  h += unanswered
    ? '<div class="hintline" style="color:var(--red);font-weight:700">Answer the repeat check'+(unanswered>1?'s':'')+' above before generating.</div>'+
      '<button class="btn b-ghost" style="width:100%" disabled>Generate invoice</button>'
    : '<button class="btn b-primary" style="width:100%" onclick="saveMonthly()">Generate invoice</button>';

  document.getElementById('genbody').innerHTML = h;
}

function answerDup(i,ans){
  var gr = GEN.groups[i];
  gr.answer = ans;
  if(ans){
    var seen = false;
    GEN.lines.forEach(function(l){
      if(l.group!==i) return;
      if(ans==='keep'){ l.include = true; }
      else { l.include = !seen; seen = true; }   // keep the first, drop the rest
    });
  }
  GEN.number = val('i-mnum'); GEN.dateRaised = val('i-mdate'); GEN.status = val('i-mstat');
  renderGen();
}
function toggleGenLine(i){
  GEN.lines[i].include = !GEN.lines[i].include;
  GEN.number = val('i-mnum'); GEN.dateRaised = val('i-mdate'); GEN.status = val('i-mstat');
  renderGen();
}

  var num = val('i-mnum');
  if(!num){ toast('Put your invoice number in first'); return; }
  var lines = GEN.lines.filter(function(l){return l.include;})
    .map(function(l){ return {entryId:l.id, address:l.address, date:l.date, ref:l.ref, desc:l.desc, amount:l.amount}; });
  if(!lines.length){ toast('Tick at least one property'); return; }
  var rec = {
    contractorId: GEN.cid, month: GEN.mk, number: num,
    dateRaised: val('i-mdate') || today(),
    status: val('i-mstat') || 'Pending',
    paid: 0, datePaid: '', notes: '',
    amount: sum(lines,function(l){return l.amount;}),
    lines: lines
  };
  var id = GEN.editing || uid('m');
  closeModal();
  save('minvoices/'+id, rec, 'Invoice '+num+' generated');
}

/* ─────────────── SOR codes & office approval ───────────────
   Each property keeps its own codes. A code is Pending until the office
   checks it, then Approved, Amended (new quantity) or Removed.
   The property's value is always the sum of its codes that still count,
   and every monthly invoice that contains the property is re-totalled
   in the same save — so removing a code updates the invoice by itself. */
var CODE_STATUSES = ['Pending','Approved','Amended','Removed','Not invoiced'];
function sCls(s){ return String(s||'Pending').replace(/\s+/g,''); }
var CM = null;   // open codes screen: {kind:'entry'|'inv', id, back, onlyOpen}

function r2(x){ return Math.round(n(x)*100)/100; }
function findEntry(id){ var r=null; DB.entries.forEach(function(x){ if(x.id===id) r=x; }); return r; }
function codesOf(e){
  if(!e || !e.codes) return [];
  return Object.keys(e.codes).map(function(k){
    var c = JSON.parse(JSON.stringify(e.codes[k]||{})); c.id = k; return c;
  }).sort(function(a,b){ return n(a.order)-n(b.order); });
}
function hasCodes(e){ return codesOf(e).length>0; }
/* a property on a paid invoice is a closed record: its codes are shown but not editable */
function entryLocked(e){
  if(!e) return false;
  return DB.minvoices.some(function(v){ return v.status==='Paid' && linesOf(v).some(function(x){ return x.l.entryId===e.id; }); });
}
function codeClaimed(k){ return k.status==='Not invoiced' ? 0 : r2(n(k.qty)*n(k.rate)); }
function codeValue(k){
  if(k.status==='Removed' || k.status==='Not invoiced') return 0;
  var q = (k.status==='Amended' && k.apprQty!=='' && k.apprQty!=null) ? n(k.apprQty) : n(k.qty);
  return r2(q*n(k.rate));
}
function codesTotal(e){ return r2(sum(codesOf(e),codeValue)); }
function codesClaimed(e){ return r2(sum(codesOf(e),codeClaimed)); }
function codeCounts(e){
  var c={Pending:0,Approved:0,Amended:0,Removed:0,NI:0,all:0};
  codesOf(e).forEach(function(k){
    if(k.status==='Not invoiced'){ c.NI++; return; }
    c[k.status||'Pending']=(c[k.status||'Pending']||0)+1; c.all++;
  });
  return c;
}
function codeChip(e){
  var c = codeCounts(e);
  if(!c.all) return '<span class="pill p-none">'+(c.NI?c.NI+' not invoiced':'No codes')+'</span>';
  var t = c.all+' code'+(c.all===1?'':'s')+(c.NI?' (+'+c.NI+' not invoiced)':'');
  if(c.Pending===c.all) return '<span class="pill p-pend">'+t+' · awaiting office</span>';
  if(c.Removed===c.all) return '<span class="pill p-unpaid">'+t+' · all removed</span>';
  if(c.Pending)         return '<span class="pill p-part">'+t+' · '+c.Pending+' awaiting office</span>';
  if(c.Removed||c.Amended){
    var bits=[]; if(c.Removed) bits.push(c.Removed+' removed'); if(c.Amended) bits.push(c.Amended+' amended');
    return '<span class="pill p-part">'+t+' · '+bits.join(', ')+'</span>';
  }
  return '<span class="pill p-paid">'+t+' · all approved</span>';
}
function linesOf(v){
  var L = v.lines || [];
  if(Array.isArray(L)) return L.map(function(l,i){ return {l:l,i:i}; }).filter(function(x){ return x.l; });
  return Object.keys(L).map(function(k){ return {l:L[k],i:k}; });
}
function lineOrig(l){ return l.origAmount!=null ? n(l.origAmount) : n(l.amount); }
function invOrig(v){ return v.origAmount!=null ? n(v.origAmount) : n(v.amount); }

/* add to `map` the changes that re-total every monthly invoice holding these
   properties. `amts` is {entryId: newValue}. */
function invoiceSyncMap(amts, map){
  DB.minvoices.forEach(function(v){
    if(v.status==='Paid') return;   // a paid invoice is a record of what was received — never change it
    var hit=false, tot=0;
    linesOf(v).forEach(function(x){
      var a = n(x.l.amount), id = x.l.entryId;
      if(id && amts.hasOwnProperty(id)){
        var na = amts[id];
        if(Math.abs(a-na)>0.004){
          if(x.l.origAmount==null) map['minvoices/'+v.id+'/lines/'+x.i+'/origAmount'] = a;
          map['minvoices/'+v.id+'/lines/'+x.i+'/amount'] = na;
          hit = true;
        }
        a = na;
      }
      tot += a;
    });
    if(!hit) return;
    tot = r2(tot);
    if(v.origAmount==null) map['minvoices/'+v.id+'/origAmount'] = n(v.amount);
    map['minvoices/'+v.id+'/amount'] = tot;
  });
  return map;
}

function cleanCode(k,i){
  return {code:String(k.code||''), desc:k.desc||'', qty:n(k.qty), rate:n(k.rate),
          status:k.status||'Pending',
          apprQty:(k.apprQty===''||k.apprQty==null)?'':n(k.apprQty),
          comment:k.comment||'', loc:k.loc||'', order:i};
}
/* write one property's codes, its new value and every affected invoice in one save */
function writeCodes(entryId, list, msg, map){
  var e = findEntry(entryId); if(!e) return;
  map = map || {};
  var obj = {};
  list.forEach(function(k,i){ obj[k.id||uid('k')] = cleanCode(k,i); });
  map['entries/'+entryId+'/codes'] = list.length ? obj : null;
  if(list.length){
    var amt = r2(sum(Object.keys(obj).map(function(k){return obj[k];}), codeValue));
    map['entries/'+entryId+'/amount'] = amt;
    var o={}; o[entryId]=amt; invoiceSyncMap(o, map);
  }
  return applyUpdate(map, msg);
}

/* ---- single-code actions ---- */
function setCode(entryId, codeId, field, value){
  var e = findEntry(entryId); if(!e) return;
  if(entryLocked(e)){ toast('This property is on a paid invoice — its codes are locked'); renderCM(); return; }
  var list = codesOf(e), was = n(e.amount);
  list.forEach(function(k){
    if(k.id!==codeId) return;
    k[field] = value;
    if(field==='status' && value==='Amended' && (k.apprQty===''||k.apprQty==null)) k.apprQty = k.qty;
    if(field==='status' && value!=='Amended') k.apprQty = '';
  });
  var now = r2(sum(list,codeValue));
  var msg = (field==='status' || field==='apprQty' || field==='qty' || field==='rate')
    ? (Math.abs(now-was)>0.004 ? 'Saved · property now '+fmt(now)+' (was '+fmt(was)+')'+
        (DB.minvoices.some(function(v){ return linesOf(v).some(function(x){ return x.l.entryId===entryId; }); })?' · invoice updated':'') : 'Saved')
    : 'Saved';
  writeCodes(entryId, list, msg);
}
function delCode(entryId, codeId){
  var e = findEntry(entryId); if(!e) return;
  if(entryLocked(e)){ toast('This property is on a paid invoice — its codes are locked'); return; }
  var before = codesOf(e);
  var list = before.filter(function(k){ return k.id!==codeId; });
  writeCodes(entryId, list);

}
function approveAllEntry(entryId){
  var e = findEntry(entryId); if(!e) return;
  var list = codesOf(e); var c=0;
  list.forEach(function(k){ if((k.status||'Pending')==='Pending'){ k.status='Approved'; c++; } });
  if(!c){ toast('Nothing awaiting the office'); return; }

/* paste rows straight from Excel: any row with a 6-digit code becomes a code.
   Numbers after the code are read as quantity, then rate. */
function parseCodeLines(txt, hist){
  var out=[], skipped=0;
  txt.split(/\r?\n/).forEach(function(line){
    if(!line.trim()) return;
    var cells = line.indexOf('\t')>-1 ? line.split('\t') : line.trim().split(/\s+/);
    cells = cells.map(function(s){ return s.trim(); }).filter(function(s){ return s!==''; });
    var ci = -1;
    for(var i=0;i<cells.length;i++){ if(/^\d{6}$/.test(cells[i])){ ci=i; break; } }
    if(ci<0){ skipped++; return; }
    var code = cells[ci], nums=[], words=[];
    var isNum = function(s){ return /^£?-?[\d,]*\.?\d+$/.test(s); };
    var tabbed = line.indexOf('\t')>-1;
    var rest = cells.slice(ci+1);
    if(tabbed){
      rest.forEach(function(s){ if(isNum(s)) nums.push(n(s.replace(/[£,]/g,''))); else if(!/^[A-Za-z]{1,3}$/.test(s)) words.push(s); });
    } else {
      var j = rest.length;
      while(j>0 && (isNum(rest[j-1]) || /^[A-Za-z]{1,2}$/.test(rest[j-1]))) j--;
      words = rest.slice(0,j);
      rest.slice(j).forEach(function(s){ if(isNum(s)) nums.push(n(s.replace(/[£,]/g,''))); });
    }
    var h = hist[code] || {};
    var qty = nums.length ? nums[0] : 1;
    var rate = nums.length>1 ? nums[1] : (h.rate!=null ? n(h.rate) : 0);
    out.push({code:code, desc:words.join(' ') || h.desc || '', qty:qty, rate:rate, status:'Pending'});
  });
  return {rows:out, skipped:skipped};
}
function pasteCodes(){
  var e = findEntry(CM.id); if(!e) return;
  var p = parseCodeLines(val('cm-paste'), codeHistory(e.contractorId));
  if(!p.rows.length){ toast('No 6-digit SOR codes found in what you pasted'); return; }
  var noRate = p.rows.filter(function(k){ return !n(k.rate); }).length;
  CM.keep = {};
  writeCodes(e.id, codesOf(e).concat(p.rows),
    p.rows.length+' code'+(p.rows.length===1?'':'s')+' added'+
    (p.skipped? ' · '+p.skipped+' line'+(p.skipped===1?'':'s')+' skipped':'')+
    (noRate? ' · check '+noRate+' with no rate':''));
}

function approveAllInv(invId){
  var v = findMonthly(invId); if(!v) return;
  var map = {}, c = 0, done = {};
  // build one combined save so the invoice total is worked out once, correctly
  var newAmt = {};
  linesOf(v).forEach(function(x){
    var e = findEntry(x.l.entryId); if(!e || done[e.id]) return; done[e.id]=1;
    var list = codesOf(e), changed=false;
    list.forEach(function(k){ if((k.status||'Pending')==='Pending'){ k.status='Approved'; c++; changed=true; } });
    if(!changed) return;
    var obj={}; list.forEach(function(k,i){ obj[k.id]=cleanCode(k,i); });
    map['entries/'+e.id+'/codes'] = obj;
    newAmt[e.id] = r2(sum(list,codeValue));
    map['entries/'+e.id+'/amount'] = newAmt[e.id];
  });
  if(!c){ toast('Nothing awaiting the office on this invoice'); return; }
  // approving never lowers a value, but keep the invoice in step anyway
  invoiceSyncMap(newAmt, map);
  applyUpdate(map, c+' code'+(c===1?'':'s')+' approved');
}


/* ─────────────── import a paid invoice from the office's Excel ───────────────
   Reads the reconciliation workbook the office returns: an "Invoice Data" sheet
   (property heading rows, then one row per SOR code with its payment status)
   and, if present, a "Payment Summary" sheet with the paid figure per property.
   Creates the properties with their codes and decisions, plus one monthly
   invoice marked Paid, in a single save. */
var IMP = null;
var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function loadXLSX(cb){
  if(window.XLSX) return cb();
  var s = document.createElement('script');
  s.src = XLSX_URL;
  s.onload = function(){ cb(); };
  s.onerror = function(){ toast('Could not load the Excel reader — check your connection'); };
  document.head.appendChild(s);
}
function addrKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function tidy(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }
function num2(x){ if(typeof x==='number') return x; var v=parseFloat(String(x==null?'':x).replace(/[£,\s]/g,'')); return isNaN(v)?0:v; }
function ukToIso(s){ var m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s||'')); return m ? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : ''; }
function findSheet(wb, re){ for(var i=0;i<wb.SheetNames.length;i++) if(re.test(wb.SheetNames[i])) return wb.Sheets[wb.SheetNames[i]]; return null; }
function rowsOf(ws){ return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false}); }

function mapCodeStatus(st){
  var u = String(st||'').toUpperCase();
  if(u.indexOf('REMOVED')>-1) return 'Removed';
  if(u.indexOf('NOT INVOICED')>-1) return 'Not invoiced';
  if(u.indexOf('DUPLICATE')>-1) return 'Duplicate';
  if(u.indexOf('AMEND')>-1) return 'Amended';
  if(u.indexOf('PAID')>-1 || u.indexOf('APPROVED')>-1) return 'Approved';
  return 'Pending';
}

function parsePaidWorkbook(wb, fileName){
  var dataWs = findSheet(wb,/invoice\s*data/i) || wb.Sheets[wb.SheetNames[wb.SheetNames.length>1?1:0]];
  var props = [], cur = null;
  rowsOf(dataWs).forEach(function(r){
    var a = r[0];
    if(a!=null && /^\d{6}$/.test(String(a).trim())){
      if(!cur) return;
      var qty = num2(r[4]) || 1, line = num2(r[5]);
      cur.codes.push({code:String(a).trim(), desc:tidy(r[1]), loc:tidy(r[3]), qty:qty, rate:line/qty,
                      status:mapCodeStatus(r[7]), comment:tidy(r[9]) || ''});
    } else if(typeof a==='string' && tidy(a) && !/^(sor code|property address)$/i.test(tidy(a))){
      cur = {address:tidy(a), codes:[]};
      props.push(cur);
    }
  });

  var out = {fileName:fileName, number:'', date:'', props:[], skipped:[], check:null};
  var sumWs = findSheet(wb,/payment\s*summary|summary/i);
  var summ = [];
  if(sumWs){
    var rows = rowsOf(sumWs);
    var title = tidy(rows[0] && rows[0][0]), sub = tidy(rows[1] && rows[1][0]);
    var m = /^(.+?)\s+-\s+/.exec(title); if(m) out.number = m[1].trim();
    out.date = ukToIso(sub) || ukToIso(title);
    var started = false;
    rows.forEach(function(r){
      var a = tidy(r[0]);
      if(/^property address$/i.test(a)){ started = true; return; }
      if(!started || !a) return;
      if(/^total paid$/i.test(a)) out.check = {paidOnSheet:num2(r[1])};
      if(r[4]==null || r[4]==='') return;
      summ.push({address:a, sheet:num2(r[1]), removed:num2(r[2]), paid:num2(r[3]), status:tidy(r[4]), remark:tidy(r[5])});
    });
  }
  if(!out.number){ var fm = /([A-Za-z]+)[ _-]?(\d{5,6})/.exec(fileName||''); if(fm) out.number = fm[1].toUpperCase()+' '+fm[2]; }

  props.forEach(function(p,i){
    var s = summ[i] && addrKey(summ[i].address)===addrKey(p.address) ? summ[i] : null;
    var dup = (s && /duplicate/i.test(s.status)) || (p.codes.length && p.codes.every(function(k){return k.status==='Duplicate';}));
    if(dup){ out.skipped.push(p.address+' — duplicate, not invoiced'); return; }
    p.codes.forEach(function(k){ if(k.status==='Duplicate') k.status='Removed'; });
    var claimed = r2(sum(p.codes,codeClaimed)), value = r2(sum(p.codes,codeValue));
    p.invoiced = s ? r2(s.paid + s.removed) : claimed;
    p.paid     = s ? r2(s.paid) : value;
    p.remark   = s ? s.remark : '';
    p.value    = value;
    out.props.push(p);
  });
  out.invoiced = r2(sum(out.props,function(p){return p.invoiced;}));
  out.paid     = r2(sum(out.props,function(p){return p.paid;}));
  out.removed  = r2(out.invoiced - out.paid);
  out.codeCount = sum(out.props,function(p){return p.codes.length;});
  out.removedCodes = sum(out.props,function(p){return p.codes.filter(function(k){return k.status==='Removed';}).length;});
  return out;
}

function openImport(){
  IMP = null;
  openModal('Import paid invoice',
    '<div class="hintline" style="margin-top:0">Choose the reconciliation Excel the office sends back. Every property, its codes and the office decisions are saved, with the invoice marked as paid.</div>'+
    '<div class="f"><label>Excel file</label><input id="imp-file" type="file" accept=".xlsx,.xlsm,.xls" onchange="readImport(this)"></div>'+
    '<div id="imp-body"></div>');
}
function readImport(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  document.getElementById('imp-body').innerHTML = '<div class="hintline">Reading '+esc(f.name)+'…</div>';
  loadXLSX(function(){
    var rd = new FileReader();
    rd.onload = function(ev){
      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        IMP = parsePaidWorkbook(wb, f.name);
        if(!IMP.props.length){ document.getElementById('imp-body').innerHTML = '<div class="dupbox"><div class="dt">No properties found</div><div class="dl">This file does not look like an office reconciliation sheet.</div></div>'; return; }
        renderImport();
      }catch(err){
        document.getElementById('imp-body').innerHTML = '<div class="dupbox"><div class="dt">Could not read this file</div><div class="dl">'+esc(err.message)+'</div></div>';
      }
    };
    rd.readAsArrayBuffer(f);
  });
}
function guessContractor(){
  var pick = null;
  [/b\s*&\s*x/i,/peabody/i,/pgm/i].some(function(re){
    DB.contractors.some(function(c){ if(re.test(c.name)){ pick=c.id; return true; } return false; });
    return !!pick;
  });
  return pick || (DB.contractors[0]&&DB.contractors[0].id);
}
function renderImport(){
  var I = IMP;
  var h = '<div class="stats">'+stat('Properties',String(I.props.length),'')+stat('Invoiced',fmt(I.invoiced),'')+
          stat('Removed by office',fmt(I.removed),I.removed>0?'out':'')+stat('Paid',fmt(I.paid),'paid')+'</div>';
  if(I.check){
    var ok = Math.abs(I.check.paidOnSheet - I.paid) < 0.01;
    h += '<div class="dupbox'+(ok?' done':'')+'"><div class="dt">'+(ok?'✓ Matches the office total':'⚠ Does not match the office total')+'</div>'+
         '<div class="dl">Office sheet says '+fmt(I.check.paidOnSheet)+' paid · this import adds up to '+fmt(I.paid)+'.</div></div>';
  }
  h += '<div class="f2"><div class="f"><label>Invoice number</label><input id="imp-num" value="'+esc(I.number)+'"></div>'+
       '<div class="f"><label>Contractor</label><select id="imp-cont">'+contractorOptions(guessContractor())+'</select></div></div>'+
       '<div class="f2"><div class="f"><label>Invoice date</label><input id="imp-date" type="date" value="'+esc(I.date||today())+'"></div>'+
       '<div class="f"><label>Date paid (optional)</label><input id="imp-paid" type="date" value=""></div></div>'+
       '<div class="hintline">Properties are filed under the invoice date ('+(I.date?monthFull(I.date.slice(0,7)):'—')+'), because the sheet has no completion dates.</div>';
  if(I.skipped.length) h += '<div class="hintline">Left out: '+I.skipped.map(esc).join('; ')+'</div>';
  h += '<div class="sec"><h3>'+I.codeCount+' codes · '+I.removedCodes+' removed by office</h3></div><div class="tw" style="max-height:320px;overflow:auto"><table><thead><tr><th>#</th><th>Property</th><th class="num">Invoiced</th><th class="num">Paid</th><th>Note</th></tr></thead><tbody>';
  I.props.forEach(function(p,i){
    var cut = p.invoiced - p.paid > 0.004;
    h += '<tr><td>'+(i+1)+'</td><td>'+esc(p.address)+'</td><td class="num">'+fmt(p.invoiced)+'</td><td class="num"'+(cut?' style="color:var(--red);font-weight:800"':'')+'>'+fmt(p.paid)+'</td><td class="mute">'+esc(p.remark||'')+'</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<button class="btn b-primary" style="width:100%;margin-top:12px" onclick="saveImport()">Import as paid invoice</button>';
  document.getElementById('imp-body').innerHTML = h;
}
function saveImport(){
  var I = IMP; if(!I) return;
  var num = val('imp-num'), cid = val('imp-cont'), date = val('imp-date'), datePaid = val('imp-paid');
  if(!num){ toast('Enter the invoice number'); return; }
  if(!cid){ toast('Choose a contractor'); return; }
  if(!date){ toast('Enter the invoice date'); return; }
  var clash = DB.minvoices.filter(function(v){ return v.contractorId===cid && String(v.number||'').trim().toLowerCase()===num.toLowerCase(); });
  if(clash.length && !confirm('Invoice '+num+' is already in the app for this contractor. Import it again anyway?')) return;
  var map = {}, lines = [];
  I.props.forEach(function(p){
    var eid = uid('e'), codes = {};
    p.codes.forEach(function(k,i){ codes[uid('k')] = cleanCode(k,i); });
    map['entries/'+eid] = {address:p.address, date:date, amount:p.value, ref:'', desc:p.remark||'', contractorId:cid, codes:codes};
    var line = {entryId:eid, address:p.address, date:date, ref:'', desc:p.remark||'', amount:p.paid};
    if(Math.abs(p.invoiced-p.paid)>0.004) line.origAmount = p.invoiced;
    lines.push(line);
  });
  var mid = uid('m');
  map['minvoices/'+mid] = {contractorId:cid, month:date.slice(0,7), number:num, dateRaised:date,
    status:'Paid', paid:I.paid, datePaid:datePaid, amount:I.paid, origAmount:I.invoiced,
    notes:'Imported from '+I.fileName+(I.removed>0?' · '+fmt(I.removed)+' removed by office':''), lines:lines};
  closeModal();
  applyUpdate(map, 'Invoice '+num+' imported · '+I.props.length+' properties · '+fmt(I.paid)+' paid').then(function(){
    go({view:'month', cid:cid, mk:date.slice(0,7)});
  });
  IMP = null;
}

/* ─────────────────────────── misc ─────────────────────────── */
function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m; t.style.pointerEvents='none'; t.className='on';
  clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},2600);
}
function toastUndo(m,restore){
  var t=document.getElementById('toast');
  t.innerHTML = esc(m)+' <button id="undob" style="background:var(--yellow);color:var(--navy);border:0;border-radius:999px;padding:5px 13px;font-weight:800;font-size:12px;margin-left:8px;cursor:pointer">Undo</button>';
  t.style.pointerEvents='auto'; t.className='on';
  document.getElementById('undob').onclick=function(){ hideToast(); restore(); };
  clearTimeout(t._t); t._t=setTimeout(hideToast, 9000);
}
function hideToast(){
  var t=document.getElementById('toast');
  t.className=''; t.style.pointerEvents='none';
}
function toggleRO(){
  var on = !document.body.classList.contains('ro');
  document.body.classList.toggle('ro', on);
  document.getElementById('robtn').textContent = 'View only: ' + (on?'on':'off');
  toast(on ? 'View only — editing hidden on this device' : 'Editing switched back on');
}

/* ─────────────────────────── connect ─────────────────────────── */
function fatal(title, detail){
  document.getElementById('synced').textContent = 'Not connected';
  document.getElementById('app').innerHTML =
    '<div class="empty-state" style="border-color:#fecaca;background:#fff5f5">'+
    '<b style="color:var(--red)">'+title+'</b>'+detail+'</div>';
}

(function(){
  if(!FB_OK){
    fatal('Cannot reach the database',
      'The Firebase library did not load. This usually means the page is being previewed somewhere that blocks outside scripts, or there is no internet connection.<br><br>'+
      'Open the live link instead:<br><b>kainatnaseer-khan.github.io/invoice-tracker/</b>');
    return;
  }
  render();
  var connected = false;
  if(auth && auth.signInAnonymously){
    auth.signInAnonymously().then(watchData).catch(watchData);
  } else {
    watchData();
  }
  rtdb.ref('.info/connected').on('value', function(sn){ if(sn.val()) connected = true; });
  setTimeout(function(){
    if(!connected){
      fatal('Connected to the internet, but not to your data',
        'Two things to check in the Firebase console:<br><br>'+
        '<b>1.</b> Authentication → Sign-in method → <b>Anonymous</b> is switched on.<br>'+
        '<b>2.</b> Realtime Database → Rules → published, not left on expired test mode.<br><br>'+
        'Fix either one and refresh this page.');
    }
  }, 10000);
})();
