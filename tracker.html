<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Job Tracker — Leon Electricians Ltd</title>
<style>
:root{--navy:#0b1b33;--navy2:#132a4c;--yellow:#f3c623;--bg:#eef1f6;--line:#dde3ec;--ink:#101827;--mute:#6b7280;
  --green:#15803d;--amber:#b45309;--red:#b91c1c;--blue:#1d4ed8;--purple:#6d28d9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.hdr{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:60}
.hdr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1280px;margin:auto}
.hdr h1{font-size:17px;color:var(--yellow);font-weight:800}
.hdr .sub{font-size:11px;color:#a8bcd8;margin-top:1px}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:#a8bcd8;background:#ffffff14;border-radius:999px;padding:5px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}
.nav{display:flex;gap:6px;margin-top:10px;max-width:1280px;margin-left:auto;margin-right:auto;flex-wrap:wrap}
.nbtn{background:transparent;border:1.5px solid #ffffff33;color:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.nbtn.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.mini{background:#ffffff14;border:1.5px solid #ffffff26;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.wrap{max-width:1280px;margin:auto;padding:14px 12px 80px}
h2.page{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:2px}
p.page{font-size:13px;color:var(--mute);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;border-top:4px solid var(--c,var(--navy))}
.stat:hover{box-shadow:0 4px 14px #0b1b3314}
.stat .k{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.stat .v{font-size:22px;font-weight:800;margin-top:4px;color:var(--c,var(--navy))}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.sec h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--navy)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.p-green{background:#dcfce7;color:var(--green)} .p-amber{background:#fef3c7;color:var(--amber)} .p-red{background:#fee2e2;color:var(--red)}
.p-blue{background:#dbeafe;color:var(--blue)} .p-grey{background:#f1f5f9;color:var(--mute)} .p-purple{background:#ede9fe;color:var(--purple)}
.p-solidred{background:var(--red);color:#fff} .p-solidgreen{background:#16a34a;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
th{background:var(--navy);color:var(--yellow);text-align:left;padding:8px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tbody tr{cursor:pointer} tbody tr:hover td{background:#f8fafc}
tfoot td{background:#f8fafc;font-weight:800;border-top:2px solid var(--navy)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
.num{text-align:right;white-space:nowrap}
.nowrap{white-space:nowrap}
.mute{color:var(--mute);font-size:11.5px}
.btn{border:0;border-radius:9px;padding:9px 15px;font-weight:800;font-size:13px;cursor:pointer}
.btn:active{opacity:.75}
.b-primary{background:var(--navy);color:#fff} .b-yellow{background:var(--yellow);color:var(--navy)}
.b-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)} .b-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chip .cnt{background:#f1f5f9;border-radius:999px;padding:1px 7px;font-size:11px;color:var(--mute)}
.chip.on{background:var(--cc,var(--navy));color:#fff;border-color:var(--cc,var(--navy))}
.chip.on .cnt{background:#ffffff33;color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-weight:600}
.bar input{min-width:220px;flex:1}
.empty-state{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:30px 18px;text-align:center;color:var(--mute)}
.empty-state b{display:block;color:var(--navy);font-size:15px;margin-bottom:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ticks span{display:inline-block;width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;text-align:center;line-height:18px;margin-right:2px}
.t-yes{background:#dcfce7;color:var(--green)} .t-no{background:#fee2e2;color:var(--red)} .t-na{background:#f1f5f9;color:#9ca3af}
.rep{background:#fee2e2;color:var(--red);border-radius:999px;padding:1px 7px;font-size:10px;font-weight:800;margin-left:5px;white-space:nowrap}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* modal */
.mbg{display:none;position:fixed;inset:0;background:#0b1b33cc;z-index:200;align-items:flex-end;justify-content:center}
.mbg.on{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:900px;max-height:94vh;overflow-y:auto;padding:16px 16px 24px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.mhead h4{font-size:16px;font-weight:800;color:var(--navy)}
.fs{border:1px solid var(--line);border-radius:12px;padding:10px 12px 4px;margin-bottom:10px}
.fs legend{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--navy);padding:0 6px}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.f{margin-bottom:8px}
.f.w2{grid-column:span 2} .f.w4{grid-column:span 4}
.f label{display:block;font-size:11px;font-weight:800;color:#374151;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy)}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute);margin:4px 0 10px}
.box{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
.box.warn{background:#fff7ed;border:1.5px solid #fed7aa;color:#7c2d12}
.box.ok{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#14532d}
.box.info{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e3a8a}
.mbars{display:flex;gap:6px;align-items:flex-end;height:150px;padding:10px 4px 0}
.mbars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.mbars .b i{display:block;width:100%;background:var(--navy);border-radius:5px 5px 0 0;min-height:2px}
.mbars .b span{font-size:10px;color:var(--mute);margin-top:4px;white-space:nowrap}
.mbars .b em{font-size:10px;font-style:normal;font-weight:800;color:var(--navy);margin-bottom:2px}
.sgrp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sgh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.sga{font-size:15px;font-weight:800;color:var(--navy)}
.sent{border-top:1px solid var(--line);padding:9px 0 5px;cursor:pointer}
.sent:hover{background:#f8fafc}
.sinv{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:5px 9px;margin:5px 5px 0 0}
/* month tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin-bottom:6px}
.tile{background:#fff;border:1px solid var(--line);border-left:6px solid var(--tc,#cbd5e1);border-radius:14px;padding:13px 14px;cursor:pointer}
.tile:hover{box-shadow:0 4px 14px #0b1b3318}
.tt{font-weight:800;font-size:16px;color:var(--navy);margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;color:var(--mute)} .tl b{color:var(--ink)}
.tinv{margin:9px 0 7px;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
.st-ok{--tc:#16a34a} .st-missed{--tc:#b91c1c} .st-toadd,.st-split{--tc:#f59e0b} .st-open{--tc:#1d4ed8} .st-empty{--tc:#cbd5e1}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--tc,#cbd5e1);flex:none}
.yr{font-size:12px;font-weight:800;color:var(--mute);margin:18px 0 8px;letter-spacing:.8px;text-transform:uppercase}
.trow{display:flex;align-items:center;gap:7px;padding:7px 4px;border-top:1px solid var(--line);font-size:12.5px}
.trow:hover{background:#f8fafc}
.trow .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.miss td{background:#fff1f2}
.crumbs{font-size:12.5px;color:var(--mute);margin-bottom:8px} .crumbs a{color:var(--blue);font-weight:700;text-decoration:none}
.invbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.invbox input{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-weight:800;width:200px}
.chk{width:18px;height:18px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:900;transition:transform .25s;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
body.ro .editable{display:none!important}
body.ro .f input,body.ro .f select,body.ro .f textarea{pointer-events:none;background:#f8fafc}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)} .fg{grid-template-columns:1fr 1fr} .f.w4{grid-column:span 2} .grid2{grid-template-columns:1fr}}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr} .hdr h1{font-size:15px} .bar input{min-width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="toast"></div>
<div class="hdr">
  <div class="hdr-top">
    <div><h1>⚡ JOB TRACKER</h1><div class="sub">Leon Electricians Ltd — every property, every contractor</div></div>
    <div class="spacer"></div>
    <div class="live"><span class="dot"></span><span id="synced">Connecting…</span></div>
    <a class="mini" href="https://kainatnaseer-khan.github.io/invoice-tracker/" target="_blank" rel="noopener">Invoices ↗</a>
    <button class="mini" id="robtn" onclick="toggleRO()">View only: off</button>
  </div>
  <div class="nav">
    <button class="nbtn" id="nav-dash" onclick="go({view:'dash'})">Dashboard</button>
    <button class="nbtn" id="nav-months" onclick="go({view:'months'})">📅 Months</button>
    <button class="nbtn" id="nav-jobs" onclick="go({view:'jobs'})">Jobs</button>
    <button class="nbtn" id="nav-find" onclick="go({view:'find'})">🔍 Find property</button>
    <button class="nbtn editable" id="nav-data" onclick="go({view:'data'})">⚙ Data</button>
  </div>
</div>
<div class="wrap" id="app"><div class="empty-state"><b>Loading your records…</b>One moment.</div></div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="mhead"><h4 id="mtitle"></h4><button class="btn b-ghost" style="padding:7px 12px" onclick="closeModal()">Close</button></div><div id="mbody"></div></div>
</div>

<script>
/* ───────── Firebase — the same database as the invoice tracker. Jobs live under /tracker,
   so nothing in the invoice app is touched. Invoices are only read, to show where a property was billed. ───────── */
var firebaseConfig = {
  apiKey: "AIzaSyDQu3EBjsp4pEBqLWu0gMjxFtqQRgkB3hw",
  authDomain: "leon-invoice-tracker.firebaseapp.com",
  databaseURL: "https://leon-invoice-tracker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "leon-invoice-tracker",
  storageBucket: "leon-invoice-tracker.firebasestorage.app",
  messagingSenderId: "581901171052",
  appId: "1:581901171052:web:03e871c58de1c76d3fdb49"
};
var FB_OK = (typeof firebase !== 'undefined' && firebase.initializeApp);
var auth = null, rtdb = null;
if(FB_OK){ firebase.initializeApp(firebaseConfig); auth = firebase.auth(); rtdb = firebase.database(); }

var ROOT = 'tracker';
var DB = {contractors:[], jobs:[], engineers:[], minvoices:[], months:{}, entries:[], icons:[]};
var route = {view:'dash'};
var modalOpen = false, pendingRender = false, seedTried = false, loaded = false;

var STATUSES = ['Pending','Scheduled','In Progress','Completed','Rescheduled','Cancelled'];
var JOBTYPES = ['New Void','Disposal','Snags','PIR','Disrepair','EICR','Rewire','Other'];
var PAYMENTS = ['Paid','Unpaid','Overdue','Awaiting PO'];
var YN = ['Yes','No','N/A'], YNP = ['Yes','No','Pending','N/A'];
var DEFAULT_CONTRACTORS = [['PEABODY','#1F4E79'],['MORGAN SINDALL','#7030A0'],['XPRT','#C55A11'],['EALING','#548235'],['MAIN TRADE SERVICES','#2E75B6'],['PRIVATE','#BF8F00']];
var DEFAULT_ENGINEERS = ['MATEO','SAKO','LEO','LEON','ARTHUR','MICHAEL','ALEX','ANDUEL','VISI','SID'];
var COLORS = ['#1F4E79','#7030A0','#C55A11','#548235','#2E75B6','#BF8F00','#0F766E','#B91C1C','#475569','#9D174D'];

function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function ref(p){ return rtdb.ref(p); }
function applyUpdate(map, msg){
  return rtdb.ref().update(map).then(function(){ if(msg) toast(msg); })
    .catch(function(){ toast('Could not save — check your connection'); });
}
function mapToList(obj){ if(!obj) return []; return Object.keys(obj).map(function(k){ var v = obj[k] || {}; v.id = k; return v; }); }

function watchData(){
  ref(ROOT).on('value', function(snap){
    var v = snap.val() || {};
    DB.contractors = mapToList(v.contractors).sort(function(a,b){ return (a.order||0)-(b.order||0); });
    DB.jobs = mapToList(v.jobs);
    DB.months = v.months || {};
    DB.engineers = v.engineers ? (Array.isArray(v.engineers) ? v.engineers : Object.keys(v.engineers).map(function(k){return v.engineers[k];})).filter(Boolean) : [];
    loaded = true; index(); stamp();
    if(modalOpen) pendingRender = true; else render();
    seedIfEmpty(v);
  }, function(){ document.getElementById('synced').textContent = 'No access — check your rules'; });
  // the invoice app's monthly invoices, to show which invoice a property is on
  ref('minvoices').on('value', function(snap){
    DB.minvoices = mapToList(snap.val()); index();
    if(!modalOpen && loaded) render();
  }, function(){});
  // the invoice app's properties and contractors — completed jobs are sent across automatically
  ref('entries').on('value', function(snap){ DB.entries = mapToList(snap.val()); }, function(){});
  ref('contractors').on('value', function(snap){ DB.icons = mapToList(snap.val()); }, function(){});
}
function seedIfEmpty(v){
  if(seedTried || (v && v.contractors)) return;
  seedTried = true;
  ref(ROOT + '/meta/seeded').transaction(function(cur){ return cur ? undefined : true; }, function(err, ok){
    if(err || !ok) return;
    var map = {};
    DEFAULT_CONTRACTORS.forEach(function(c,i){ map[ROOT+'/contractors/'+uid('c')] = {name:c[0], color:c[1], order:i}; });
    map[ROOT+'/engineers'] = DEFAULT_ENGINEERS;
    applyUpdate(map);
  });
}
function stamp(){ document.getElementById('synced').textContent = 'Live · ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }

/* ───────── helpers ───────── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function n(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function fmt(v){return '£'+n(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtShort(v){return '£'+Math.round(n(v)).toLocaleString('en-GB');}
function isoOf(d){var p=function(x){return String(x).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function today(){return isoOf(new Date());}
function uk(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : esc(iso); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000); }
function addDays(iso,k){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+k);return isoOf(d);}
function monthName(mk){var p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});}
function sum(a,f){var t=0;a.forEach(function(x){t+=n(f(x));});return t;}
function addrKey(s){ return String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/\blondon\b/g,' ').replace(/[^a-z0-9]/g,''); }
function con(id){ for(var i=0;i<DB.contractors.length;i++) if(DB.contractors[i].id===id) return DB.contractors[i]; return null; }
function conName(id){ var c=con(id); return c?c.name:'—'; }
function conColor(id){ var c=con(id); return c&&c.color?c.color:'#475569'; }
function engineers(){ var s={}, out=[]; DB.engineers.concat(DB.jobs.map(function(j){return j.eng;})).forEach(function(e){
    String(e||'').split('/').forEach(function(t){ t=t.trim().toUpperCase(); if(t && !s[t]){ s[t]=1; out.push(t); } }); });
  return out.sort(function(a,b){ var ia=DB.engineers.indexOf(a), ib=DB.engineers.indexOf(b); if(ia<0) ia=999; if(ib<0) ib=999; return ia-ib || (a<b?-1:1); }); }

/* ───────── the automatic checks (same rules as the Excel tracker) ───────── */
function tcdCheck(j){
  if(!j.tcd) return '';
  if(j.comp) return j.comp > j.tcd ? 'Late' : 'On time';
  if(j.status==='Cancelled') return '';
  if(j.status==='Completed') return 'Done (no date)';
  var t = today();
  if(t > j.tcd) return 'OVERDUE';
  if(daysBetween(t, j.tcd) <= 2) return 'Due soon';
  return 'On track';
}
function paperMissing(j){
  if(j.status!=='Completed') return null;
  var m = [];
  if(j.photos!=='Yes') m.push('Photos');
  if(j.codes!=='Yes' && j.codes!=='N/A') m.push('Codes');
  if(j.certreq==='Yes' && j.cert!=='Yes') m.push('Cert');
  return m;
}
/* Work done but nothing to bill: invoice number typed as XXXXX (any number of x's). */
function noCharge(j){ return /^x+$/i.test(String(j.inv||'').trim()); }
function invState(j){
  if(noCharge(j)) return 'NoCharge';
  if(j.status!=='Completed') return '';
  if(j.inv || j.invsent==='Yes') return 'Invoiced';
  return paperMissing(j).length ? 'Waiting' : 'READY';
}
function daysOpen(j){ if(!j.rec) return ''; var end = j.comp || (j.status==='Cancelled' ? j.rec : today()); return daysBetween(j.rec, end); }
var IDX = {byKey:{}, invByKey:{}, invMonth:{}};
function index(){
  IDX.byKey = {}; IDX.invByKey = {}; IDX.invMonth = {};
  Object.keys(DB.months||{}).forEach(function(k){ var r = DB.months[k]; if(r && r.inv && r.cid && r.mk) IDX.invMonth[invKey(r.cid, r.inv)] = r.mk; });
  DB.jobs.forEach(function(j){ var k = addrKey(j.addr); (IDX.byKey[k] = IDX.byKey[k] || []).push(j); });
  DB.minvoices.forEach(function(v){
    var L = v.lines || []; if(!Array.isArray(L)) L = Object.keys(L).map(function(k){return L[k];});
    L.forEach(function(l){ if(!l) return; var k = addrKey(l.address); (IDX.invByKey[k] = IDX.invByKey[k] || []).push({v:v, l:l}); });
  });
}

var FLAGS = [['','All jobs'],['open','Open (not completed)'],['overdue','Overdue'],['duesoon','Due in 2 days'],['nosched','Not scheduled'],['week','Scheduled this week'],
  ['done','Completed'],['ready','Ready to invoice'],['paper','Paperwork missing'],['missed','⚠ Missed invoice'],['norec','No date received'],['cert','Cert pending'],['unpaid','Unpaid'],['repeat','Address on 2+ jobs']];
function flagTest(f, j){
  switch(f){
    case 'open': return j.status!=='Completed' && j.status!=='Cancelled';
    case 'overdue': return tcdCheck(j)==='OVERDUE';
    case 'duesoon': return tcdCheck(j)==='Due soon';
    case 'nosched': return j.status!=='Completed' && j.status!=='Cancelled' && !j.sch;
    case 'week': return j.sch && j.sch>=today() && j.sch<=addDays(today(),6) && j.status!=='Completed';
    case 'done': return j.status==='Completed';
    case 'ready': return invState(j)==='READY';
    case 'paper': return invState(j)==='Waiting';
    case 'cert': return j.status==='Completed' && j.certreq==='Yes' && j.cert!=='Yes';
    case 'unpaid': return j.pay==='Unpaid' || j.pay==='Overdue';
    case 'repeat': return timesLogged(j)>1;
    case 'missed': return missedInvoice(j);
    case 'norec': return !mkOf(j.rec);
  }
  return true;
}
function jobsFiltered(){
  var r = route, q = String(r.q||'').toLowerCase(), qk = addrKey(r.q||'');
  var list = DB.jobs.filter(function(j){
    if(r.cid && j.con!==r.cid) return false;
    if(r.status && (r.status==='(none)' ? j.status : j.status!==r.status)) return false;
    if(r.eng && String(j.eng||'').toUpperCase().split('/').map(function(t){return t.trim();}).indexOf(r.eng)<0) return false;
    if(r.flag && !flagTest(r.flag, j)) return false;
    if(q){
      var hay = addrKey(j.addr)+'|'+String(j.uprn||'').toLowerCase()+'|'+String(j.inv||'').toLowerCase()+'|'+String(j.sor||'').toLowerCase()+'|'+String(j.rem||'').toLowerCase()+'|'+String(j.type||'').toLowerCase();
      if(hay.indexOf(qk)<0 && hay.indexOf(q)<0) return false;
    }
    return true;
  });
  var s = r.sort || 'rec-desc';
  var key = {'rec':'rec','tcd':'tcd','sch':'sch','comp':'comp','addr':'addr'}[s.split('-')[0]];
  var dir = s.split('-')[1]==='asc' ? 1 : -1;
  list.sort(function(a,b){ var x=a[key]||'', y=b[key]||''; if(!x && y) return 1; if(x && !y) return -1; return (x<y?-1:x>y?1:0)*dir || ((a.created||0)-(b.created||0)); });
  return list;
}

/* ───────── Link to the invoice app ─────────
   When a job is saved as Completed it is added to the invoice tracker as a property
   (address, completion date, total, UPRN, job type) under the matching contractor, and the two stay linked:
   later changes to the job (address, date, total…) update the property and any unpaid invoice it is on.
   If the property already has SOR codes in the invoice app, its value comes from the codes and is left alone.
   A property on a PAID invoice is never changed. */
function nameKey(s){ return String(s||'').toLowerCase().replace(/&|\band\b/g,' ').replace(/[^a-z0-9]/g,''); }
function invConFor(jobCon, map){
  var nm = conName(jobCon); if(!nm || nm==='—') return null;
  var k = nameKey(nm), hit = null;
  DB.icons.forEach(function(c){ if(!hit && nameKey(c.name)===k) hit = c; });
  DB.icons.forEach(function(c){ if(!hit){ var ck = nameKey(c.name); if(ck.indexOf(k)===0 || k.indexOf(ck)===0) hit = c; } });
  DB.icons.forEach(function(c){ if(!hit){ var first = nameKey(String(c.name).split('/')[0]); if(first && (first===k || k.indexOf(first)===0)) hit = c; } });
  if(hit) return hit.id;
  // no such contractor in the invoice app yet — add it
  var id = uid('c'), pretty = nm.toLowerCase().replace(/\b\w/g, function(m){ return m.toUpperCase(); });
  map['contractors/'+id] = {name: pretty};
  DB.icons.push({id:id, name:pretty});
  return id;
}
function findEntryById(id){ var r=null; DB.entries.forEach(function(e){ if(e.id===id) r=e; }); return r; }
function entryHasCodes(e){ return !!(e && e.codes && Object.keys(e.codes).length); }
function invLinesOf(v){ var L = v.lines || []; return Array.isArray(L) ? L.map(function(l,i){ return {l:l,i:i}; }).filter(function(x){ return x.l; }) : Object.keys(L).map(function(k){ return {l:L[k],i:k}; }); }
function entryOnInvoice(id, paidOnly){ return DB.minvoices.some(function(v){ return (!paidOnly || v.status==='Paid') && invLinesOf(v).some(function(x){ return x.l.entryId===id; }); }); }
function r2(x){ return Math.round(n(x)*100)/100; }
/* re-total every unpaid monthly invoice that holds this property */
function invTotalsMap(entryId, amount, address, date, map){
  DB.minvoices.forEach(function(v){
    if(v.status==='Paid') return;
    var hit=false, tot=0;
    invLinesOf(v).forEach(function(x){
      var a = n(x.l.amount);
      if(x.l.entryId===entryId){
        if(Math.abs(a-amount)>0.004){
          if(x.l.origAmount==null) map['minvoices/'+v.id+'/lines/'+x.i+'/origAmount'] = a;
          map['minvoices/'+v.id+'/lines/'+x.i+'/amount'] = amount; hit = true;
        }
        if(address && x.l.address!==address) map['minvoices/'+v.id+'/lines/'+x.i+'/address'] = address;
        if(date && x.l.date!==date) map['minvoices/'+v.id+'/lines/'+x.i+'/date'] = date;
        a = amount;
      }
      tot += a;
    });
    if(!hit) return;
    if(v.origAmount==null) map['minvoices/'+v.id+'/origAmount'] = n(v.amount);
    map['minvoices/'+v.id+'/amount'] = r2(tot);
  });
}
/* add to `map` what the invoice app needs for this job; returns a short note for the toast */
function linkMap(id, j, old, map){
  var e = j.entryId ? findEntryById(j.entryId) : null;
  if(j.entryId && !e) j.entryId = null;               // the property was deleted in the invoice app
  var done = j.status==='Completed';
  if(!done){
    // un-completed by mistake: take it back out, unless it is already on an invoice or has codes
    if(e && !entryOnInvoice(e.id) && !entryHasCodes(e)){ map['entries/'+e.id] = null; j.entryId = null; return 'removed from invoice app'; }
    return '';
  }
  var cid = invConFor(j.con, map); if(!cid) return '';
  var date = j.comp || today(), amt = n(j.amt);
  var rec = {address:j.addr, date:date, ref:j.uprn||'', desc:j.type||'', contractorId:cid, jobId:id};
  if(!e){
    // a property already logged by hand for this address around this date — link it instead of adding a copy
    var k = addrKey(j.addr);
    DB.entries.forEach(function(x){
      if(e || x.jobId || x.contractorId!==cid || addrKey(x.address)!==k) return;
      if(x.date && Math.abs(daysBetween(x.date, date))>60) return;
      if(DB.jobs.some(function(o){ return o.id!==id && o.entryId===x.id; })) return;
      e = x;
    });
  }
  if(!e){
    var eid = uid('e'); rec.amount = amt;
    map['entries/'+eid] = rec; j.entryId = eid;
    return 'added to invoice app';
  }
  j.entryId = e.id;
  if(entryOnInvoice(e.id, true)) return '';            // paid — a closed record
  var changed = false;
  if(e.ref) delete rec.ref;            // keep notes typed in the invoice app
  if(e.desc) delete rec.desc;
  Object.keys(rec).forEach(function(f){ if(String(e[f]==null?'':e[f])!==String(rec[f])){ map['entries/'+e.id+'/'+f] = rec[f]; changed = true; } });
  if(!entryHasCodes(e) && Math.abs(n(e.amount)-amt)>0.004){ map['entries/'+e.id+'/amount'] = amt; changed = true; }
  var newAmt = entryHasCodes(e) ? n(e.amount) : amt;
  invTotalsMap(e.id, newAmt, j.addr, date, map);
  return changed ? 'invoice app updated' : '';
}
function saveJob(){
  var j = readForm();

  if(old && old.entryId) j.entryId = old.entryId;
  var map = {}, note = '';

}
function delJob(){

/* ───────── Months: one invoice per contractor per month ─────────
   A property belongs to the month it was RECEIVED.
   It goes on that month's invoice if it is completed by the 7th of the next month (the day invoices go out).
   Completed after that, it moves to the invoice of the month it was completed in (again with the 7th rule).
   Not finished yet: it sits in whichever month's invoice is still open.
   Once a property has a month's invoice number, it stays on that month whatever happens to its dates. */
var CUTOFF_DAY = 7;
function mkOf(iso){ return /^\d{4}-\d{2}-\d{2}$/.test(String(iso||'')) ? String(iso).slice(0,7) : null; }
function shiftMk(mk,k){ var p=mk.split('-'); return isoOf(new Date(+p[0], +p[1]-1+k, 1, 12)).slice(0,7); }
function monthLong(mk){ var p=mk.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function monthOnly(mk){ var p=mk.split('-'); return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long'}); }
function cutoffOf(mk){ return shiftMk(mk,1)+'-'+String(CUTOFF_DAY).padStart(2,'0'); }
function invMonthFor(iso){ var mk = mkOf(iso); if(!mk) return null; return +String(iso).slice(8,10) <= CUTOFF_DAY ? shiftMk(mk,-1) : mk; }
function invKey(cid,inv){ return cid+'|'+String(inv==null?'':inv).trim().toLowerCase(); }
function monthRec(cid,mk){ return (DB.months||{})[cid+'__'+mk] || null; }
function monthInvNo(cid,mk){ var r = monthRec(cid,mk); return r && r.inv ? String(r.inv) : ''; }
function isInvoiced(j){ return !!(j.inv || j.invsent==='Yes'); }
function billMonth(j){
  var base = mkOf(j.rec); if(!base) return null;
  if(j.inv && !noCharge(j)){ var fixed = IDX.invMonth[invKey(j.con, j.inv)]; if(fixed) return fixed; }
  if(j.status==='Cancelled') return base;
  var when = j.status==='Completed' ? (mkOf(j.comp) ? j.comp : j.rec) : today();
  var c = invMonthFor(when);
  return c && c > base ? c : base;
}
function missedInvoice(j){
  if(j.status!=='Completed' || isInvoiced(j)) return false;
  var bm = billMonth(j); return !!bm && today() > cutoffOf(bm);
}
function monthData(cid, mk){
  var d = {A:[], B:[], C:[], X:[], N:[], R:0, inv:monthInvNo(cid,mk), cutoff:cutoffOf(mk)};
  DB.jobs.forEach(function(j){
    if(j.con!==cid) return;
    var rm = mkOf(j.rec), bm = billMonth(j);
    if(rm===mk) d.R++;
    if(j.status==='Cancelled'){ if(rm===mk) d.X.push(j); return; }
    if(noCharge(j)){ if(rm===mk) d.N.push(j); return; }
    if(bm===mk){ if(isInvoiced(j) || j.status==='Completed') d.A.push(j); else d.B.push(j); }
    else if(rm===mk) d.C.push(j);
  });
  var byRec = function(a,b){ var x=a.rec||'', y=b.rec||''; return x<y?-1:x>y?1:(a.created||0)-(b.created||0); };
  d.A.sort(byRec); d.B.sort(byRec); d.C.sort(byRec); d.X.sort(byRec); d.N.sort(byRec);
  d.groups = {}; d.order = [];
  d.A.forEach(function(j){ var k = j.inv ? String(j.inv).trim() : (j.invsent==='Yes' ? '(sent — no number)' : '');
    if(!(k in d.groups)){ d.groups[k] = []; d.order.push(k); } d.groups[k].push(j); });
  d.order.sort(function(a,b){ return !a ? 1 : !b ? -1 : (a===d.inv ? -1 : b===d.inv ? 1 : a<b?-1:1); });
  d.missing = d.groups[''] || [];
  d.nums = d.order.filter(function(k){ return k; });
  d.total = sum(d.A, function(j){ return j.amt; });
  d.passed = today() > d.cutoff;
  if(!d.A.length && !d.B.length) d.state = 'empty';
  else if(d.missing.length) d.state = d.passed ? 'missed' : 'toadd';
  else if(d.nums.length > 1) d.state = 'split';
  else if(d.B.length) d.state = 'open';
  else d.state = 'ok';
  return d;
}
function statePill(d){
  var m = d.missing.length;
  switch(d.state){
    case 'empty':  return '<span class="pill p-grey">Nothing to invoice</span>';
    case 'missed': return '<span class="pill p-solidred">⚠ '+m+' not on an invoice</span>';
    case 'toadd':  return '<span class="pill p-amber">'+m+' not on '+(d.inv ? 'invoice '+esc(d.inv) : 'an invoice')+' yet</span>';
    case 'split':  return '<span class="pill p-amber">Split over '+d.nums.length+' invoices</span>';
    case 'open':   return '<span class="pill p-blue">'+(d.A.length ? '✓ '+d.A.length+' on invoice · ' : '')+d.B.length+' still to finish</span>';
    default:       return '<span class="pill p-solidgreen">✓ All '+d.A.length+' on invoice '+esc(d.nums[0]||'')+'</span>';
  }
}
function monthsFor(cid){
  var s = {}; var add = function(m){ if(m) s[m] = 1; };
  DB.jobs.forEach(function(j){ if(cid && j.con!==cid) return; add(mkOf(j.rec)); add(billMonth(j)); });
  Object.keys(DB.months||{}).forEach(function(k){ var r = DB.months[k]; if(r && r.mk && (!cid || r.cid===cid)) add(r.mk); });
  add(today().slice(0,7));
  return Object.keys(s).sort().reverse();
}
function monthHint(j){
  var bm = billMonth(j); if(!bm || !j.con) return '';
  var c = conName(j.con), inv = monthInvNo(j.con, bm);
  if(j.status==='Cancelled') return '';
  if(noCharge(j)) return '<div class="box info"><b>No charge</b> — work done, nothing to invoice (invoice no. '+esc(j.inv)+'). It is kept off the '+esc(c)+' invoices.</div>';
  if(isInvoiced(j)) return '<div class="box ok">On the <b>'+esc(c)+' '+monthLong(bm)+'</b> invoice'+(j.inv?' — <b>'+esc(j.inv)+'</b>':'')+'.</div>';
  if(j.status==='Completed'){
    var late = today() > cutoffOf(bm);
    var btn = inv ? ' <button class="btn b-primary editable" style="padding:5px 10px;margin-left:6px" onclick="document.getElementById(\'j-inv\').value=\''+esc(inv)+'\';liveFlags()">Put on invoice '+esc(inv)+'</button>' : '';
    return '<div class="box '+(late?'warn':'info')+'">'+(late?'<b>⚠ Missed:</b> this ':'This ')+'goes on the <b>'+esc(c)+' '+monthLong(bm)+'</b> invoice'+
      (inv ? ' (<b>'+esc(inv)+'</b>) but isn’t on it yet.' : ' — no invoice number set for that month yet.')+btn+'</div>';
  }
  var rm = mkOf(j.rec), stayBy = cutoffOf(rm);
  return '<div class="box info">Received in <b>'+monthLong(rm)+'</b>. '+(today() <= stayBy
    ? 'Finish by <b>'+uk(stayBy)+'</b> to go on the '+monthOnly(rm)+' invoice; after that it moves to the next one.'
    : 'Not finished by '+uk(stayBy)+', so it has moved to the <b>'+monthLong(bm)+'</b> invoice.')+'</div>';
}

/* Months overview — tiles */
function viewMonths(){
  var cid = route.cid || '';
  var h = '<h2 class="page">Months</h2><p class="page">Each property sits in the month it was received. Completed by the '+CUTOFF_DAY+'th of the next month → it goes on that month’s invoice. Completed later → it moves to the next invoice.</p>';
  h += '<div class="chips"><div class="chip'+(cid?'':' on')+'" onclick="go({view:\'months\'})">All contractors</div>';
  DB.contractors.forEach(function(c){
    h += '<div class="chip'+(cid===c.id?' on':'')+'" style="--cc:'+c.color+'" onclick="go({view:\'months\',cid:\''+c.id+'\'})"><span class="cdot" style="background:'+c.color+'"></span>'+esc(c.name)+'</div>'; });
  h += '</div>';
  var months = monthsFor(cid), yr = '', open = false;
  var showAll = route.allm===true || months.length <= 12;
  var list = showAll ? months : months.slice(0,12), hidden = showAll ? 0 : months.length - 12;
  list.forEach(function(mk){
    var y = mk.slice(0,4);
    if(y!==yr){ if(open) h += '</div>'; h += '<div class="yr">'+y+'</div><div class="tiles">'; yr = y; open = true; }
    h += cid ? tileOne(cid, mk) : tileAll(mk);
  });
  if(open) h += '</div>';
  if(hidden) h += '<div style="text-align:center;margin-top:12px"><button class="btn b-ghost" onclick="route.allm=true;render()">Show '+hidden+' older months</button></div>';
  return h;
}
function tileOne(cid, mk){
  var d = monthData(cid, mk), now = mk===today().slice(0,7);
  return '<div class="tile st-'+d.state+'" onclick="go({view:\'month\',cid:\''+cid+'\',mk:\''+mk+'\'})">'+
    '<div class="tt">'+monthOnly(mk)+(now?' <span class="pill p-blue">This month</span>':'')+'</div>'+
    '<div class="tl"><span>Received this month</span><b>'+d.R+'</b></div>'+
    '<div class="tl"><span>On this invoice</span><b>'+d.A.length+' · '+fmtShort(d.total)+'</b></div>'+
    (d.B.length?'<div class="tl"><span>Still to finish</span><b>'+d.B.length+'</b></div>':'')+
    (d.N.length?'<div class="tl"><span>No charge (XXXXX)</span><b>'+d.N.length+'</b></div>':'')+
    (d.C.length?'<div class="tl"><span>Moved to a later invoice</span><b>'+d.C.length+'</b></div>':'')+
    '<div class="tinv">'+(d.inv?'Invoice <b>'+esc(d.inv)+'</b>':'<span class="mute">No invoice number yet</span>')+' <span class="mute">· due '+uk(d.cutoff)+'</span></div>'+
    statePill(d)+'</div>';
}
function tileAll(mk){
  var rows = '', n0 = 0, tot = 0, worst = 'empty', rank = {empty:0, ok:1, open:2, split:3, toadd:4, missed:5};
  DB.contractors.forEach(function(c){
    var d = monthData(c.id, mk);
    if(!d.R && !d.A.length && !d.B.length && !d.inv) return;
    n0 += d.R; tot += d.total; if(rank[d.state] > rank[worst]) worst = d.state;
    rows += '<div class="trow st-'+d.state+'" onclick="event.stopPropagation();go({view:\'month\',cid:\''+c.id+'\',mk:\''+mk+'\'})" title="'+esc(statePill(d).replace(/<[^>]+>/g,''))+'">'+
      '<span class="sdot"></span><span class="nm">'+esc(c.name)+'</span><span class="mute">'+d.A.length+(d.B.length?' +'+d.B.length:'')+'</span><b>'+(d.inv?esc(d.inv):'<span class="mute">—</span>')+'</b></div>';
  });
  return '<div class="tile st-'+worst+'" style="cursor:default">'+
    '<div class="tt">'+monthOnly(mk)+(mk===today().slice(0,7)?' <span class="pill p-blue">This month</span>':'')+'</div>'+
    '<div class="tl"><span>Received</span><b>'+n0+'</b></div><div class="tl"><span>On invoices</span><b>'+fmtShort(tot)+'</b></div>'+
    (rows || '<div class="mute" style="padding:6px 0">No properties</div>')+
    (rows?'<div style="margin-top:8px"><button class="btn b-ghost" style="padding:6px 10px;font-size:12px" onclick="exportMonth(\'\',\''+mk+'\')">⬇ Excel — all contractors</button></div>':'')+
  '</div>';
}

       '<p class="page" style="margin:0">Invoice '+(d.passed?'was due':'goes out on')+' <b>'+uk(d.cutoff)+'</b> · '+d.R+' propert'+(d.R===1?'y':'ies')+' received this month</p></div>'+

       '<button class="btn b-ghost editable" onclick="newJob({con:\''+cid+'\',rec:\''+(mk===today().slice(0,7)?today():'')+'\',status:\'Pending\'})">+ Add property</button></div>';
  h += monthBanner(d);
  // tally
  h += '<div class="tw" style="margin-top:10px;max-height:none"><table><thead><tr><th>Invoice no.</th><th class="num">Properties</th><th class="num">Total</th></tr></thead><tbody>';
  d.order.forEach(function(k){
    var L = d.groups[k];
    h += '<tr style="cursor:default"'+(k?'':' class="miss"')+'><td>'+(k ? '<b>'+esc(k)+'</b>'+(k===d.inv?' <span class="pill p-green">this month’s</span>':(d.inv?' <span class="pill p-amber">different number</span>':'')) : '<b style="color:var(--red)">⚠ Not on an invoice</b>')+'</td>'+
         '<td class="num">'+L.length+'</td><td class="num">'+fmt(sum(L,function(j){return j.amt;}))+'</td></tr>';
  });
  if(d.B.length) h += '<tr style="cursor:default"><td class="mute">Still to finish (not billed yet)</td><td class="num mute">'+d.B.length+'</td><td class="num mute">'+fmt(sum(d.B,function(j){return j.amt;}))+'</td></tr>';
  h += '</tbody><tfoot><tr><td>On '+monthOnly(mk)+'’s invoice</td><td class="num">'+d.A.length+'</td><td class="num">'+fmt(d.total)+'</td></tr></tfoot></table></div></div>';

  h += monthSection('On '+monthOnly(mk)+'’s invoice', d.A, mk, 'A', 'Nothing completed for this month yet.');
  if(d.B.length) h += monthSection('Still to finish', d.B, mk, 'B', '', d.passed ? '' : 'Finish by '+uk(d.cutoff)+' to go on this invoice. After that they move to the '+monthOnly(shiftMk(mk,1))+' invoice.');
  if(d.C.length) h += monthSection('Received in '+monthOnly(mk)+' — on a later invoice', d.C, mk, 'C', '', 'Not completed by '+uk(d.cutoff)+', so they moved to a later invoice. They still count as received in '+monthOnly(mk)+'.');

  if(d.X.length) h += monthSection('Cancelled', d.X, mk, 'X', '');
  return h;
}
function monthBanner(d){
  if(d.state==='empty') return '<div class="box info" style="margin-top:10px">No properties for this month yet.</div>';
  var parts = [];
  if(d.missing.length) parts.push('<b>'+d.missing.length+' completed propert'+(d.missing.length===1?'y is':'ies are')+' not on an invoice'+(d.passed?' — and the invoice date has passed.':'.')+'</b> '+
     (d.inv ? 'Press “Put '+d.missing.length+' on invoice '+esc(d.inv)+'”.' : 'Enter this month’s invoice number above, then tick them onto it.'));
  if(d.nums.length > 1) parts.push('These properties are spread over <b>'+d.nums.length+' invoice numbers</b>: '+d.nums.map(esc).join(', ')+'. Check that’s intended.');
  if(!parts.length) return '<div class="box ok" style="margin-top:10px">✓ All '+d.A.length+' completed propert'+(d.A.length===1?'y is':'ies are')+' on invoice <b>'+esc(d.nums[0]||'')+'</b>'+(d.B.length?' · '+d.B.length+' still to finish':'')+'.</div>';
  return '<div class="box warn" style="margin-top:10px'+(d.state==='missed'?';background:#fff1f2;border-color:#fecaca;color:#7f1d1d':'')+'">'+parts.join('<br>')+'</div>';
}
function monthSection(title, list, mk, kind, emptyMsg, hint){
  var h = '<div class="sec"><h3>'+title+' <span class="mute">('+list.length+')</span></h3><span class="mute">'+fmt(sum(list,function(j){return j.amt;}))+'</span></div>';
  if(hint) h += '<div class="hint" style="margin-top:-4px">'+hint+'</div>';
  if(!list.length) return h + '<div class="empty-state" style="padding:16px">'+emptyMsg+'</div>';
  h += '<div class="tw" style="max-height:none"><table><thead><tr><th>#</th><th>Received</th><th>Address</th><th>Engineer</th><th>Completed</th><th>Status</th><th title="Photos · Codes · Cert">P C ✓</th><th>Invoice</th><th class="num">Total</th></tr></thead><tbody>';
  list.forEach(function(j, i){
    var rm = mkOf(j.rec), bm = billMonth(j), note = '';
    if(kind==='A' && rm!==mk) note = '<span class="pill p-purple">Received '+monthOnly(rm)+' — carried over</span>';
    if(kind==='C') note = '<span class="pill p-blue">→ '+monthLong(bm)+' invoice'+(j.status==='Completed'||isInvoiced(j)?'':' (not finished yet)')+'</span>';
    var miss = kind==='A' && !isInvoiced(j);
    h += '<tr'+(miss?' class="miss"':'')+' onclick="openJob(\''+j.id+'\')"><td class="mute">'+(i+1)+'</td><td class="nowrap">'+uk(j.rec)+'</td>'+
      '<td><b>'+esc(j.addr)+'</b>'+(j.type?'<div class="mute">'+esc(j.type)+'</div>':'')+(note?'<div style="margin-top:3px">'+note+'</div>':'')+'</td>'+
      '<td class="nowrap">'+esc(j.eng||'')+'</td><td class="nowrap">'+uk(j.comp)+'</td><td>'+statusPill(j.status)+'</td>'+
      '<td class="ticks nowrap">'+tick(j.photos,'Photos')+tick(j.codes,'Codes')+tick(j.certreq==='Yes'?j.cert:(j.certreq==='No'?'N/A':j.cert),'Cert')+'</td>'+
      '<td class="nowrap">'+(noCharge(j)?'<span class="pill p-grey">No charge</span>':j.inv?'<b>'+esc(j.inv)+'</b>':(j.invsent==='Yes'?'<span class="mute">sent</span>':(miss?'<b style="color:var(--red)">none</b>':'')))+'</td>'+
      '<td class="num">'+(j.amt!=null&&j.amt!==''?fmt(j.amt):'')+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

/* Invoice number: saving it, and putting properties on it */
function saveMonthInv(cid, mk){
  var v = val('mi-inv').trim(), old = monthInvNo(cid, mk);
  if(v===old){ if(v) assignMonth(cid, mk); else toast('Type the invoice number first'); return; }
  var clash = v ? IDX.invMonth[invKey(cid, v)] : null;
  if(clash && clash!==mk){ toast('Invoice '+v+' is already used for '+monthLong(clash)); return; }
  var stamped = old ? DB.jobs.filter(function(j){ return j.con===cid && String(j.inv||'').trim()===old; }) : [];
  if(!v && stamped.length && !confirm('Remove invoice '+old+' from '+monthLong(mk)+'? It will also be taken off the '+stamped.length+' properties that carry it.')) return;
  var map = {}, t = Date.now();
  map[ROOT+'/months/'+cid+'__'+mk] = v ? {cid:cid, mk:mk, inv:v, updated:t} : null;
  stamped.forEach(function(j){ map[ROOT+'/jobs/'+j.id+'/inv'] = v || null; map[ROOT+'/jobs/'+j.id+'/updated'] = t; });
  applyUpdate(map, v ? 'Invoice '+v+' saved for '+monthLong(mk)+(stamped.length?' · '+stamped.length+' properties updated':'') : 'Invoice number removed')
    .then(function(){ if(v) setTimeout(function(){ if(monthData(cid,mk).missing.length) assignMonth(cid, mk); }, 250); });
}
function assignMonth(cid, mk){
  var d = monthData(cid, mk);
  if(!d.inv){ toast('Save this month’s invoice number first'); return; }
  if(!d.missing.length){ toast('Every completed property is already on an invoice'); return; }
  var h = '<div class="hint">These completed properties belong on <b>'+esc(conName(cid))+' '+monthLong(mk)+'</b> but have no invoice number. Untick any you want to hold back.</div>';
  h += '<div class="tw" style="max-height:55vh"><table><thead><tr><th><input type="checkbox" class="chk" checked onchange="document.querySelectorAll(\'.as-chk\').forEach(function(c){c.checked=this.checked}.bind(this))"></th><th>Address</th><th>Completed</th><th>Paperwork</th><th class="num">Total</th></tr></thead><tbody>';
  d.missing.forEach(function(j){
    var pm = paperMissing(j) || [];
    h += '<tr onclick="if(event.target.type!==\'checkbox\'){var c=this.querySelector(\'.as-chk\');c.checked=!c.checked;}"><td><input type="checkbox" class="chk as-chk" value="'+j.id+'" checked></td><td><b>'+esc(j.addr)+'</b></td><td class="nowrap">'+uk(j.comp)+'</td>'+
         '<td>'+(pm.length?'<span class="pill p-amber">Need: '+pm.join(', ')+'</span>':'<span class="pill p-green">All in</span>')+'</td><td class="num">'+(j.amt!=null?fmt(j.amt):'')+'</td></tr>';
  });
  h += '</tbody></table></div><div class="arow" style="margin-top:12px"><button class="btn b-primary" onclick="confirmAssign(\''+cid+'\',\''+mk+'\')">Put ticked properties on invoice '+esc(d.inv)+'</button></div>';
  openModal('Invoice '+d.inv+' — '+conName(cid)+', '+monthLong(mk), h);
}
function confirmAssign(cid, mk){
  var inv = monthInvNo(cid, mk), ids = [], map = {}, t = Date.now();
  document.querySelectorAll('.as-chk').forEach(function(c){ if(c.checked) ids.push(c.value); });
  if(!ids.length){ toast('Nothing ticked'); return; }
  ids.forEach(function(id){ map[ROOT+'/jobs/'+id+'/inv'] = inv; map[ROOT+'/jobs/'+id+'/updated'] = t; });
  closeModal();
  applyUpdate(map, ids.length+' propert'+(ids.length===1?'y':'ies')+' put on invoice '+inv);
  toastUndo(ids.length+' put on invoice '+inv, function(){ var r = {}; ids.forEach(function(id){ r[ROOT+'/jobs/'+id+'/inv'] = null; }); applyUpdate(r, 'Undone'); });
}

/* Monthly Excel — one sheet per contractor, with the tally at the bottom */
function exportMonth(cid, mk){
  loadXLSX(function(){
    var wb = XLSX.utils.book_new();
    var dt = function(v){ if(!mkOf(v)) return ''; var p = v.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12); };
    var head = ['#','Received','Address','UPRN','Job type','Engineer','Completed','Status','Invoice No','Total (£)','Note'];
    (cid ? [con(cid)] : DB.contractors).forEach(function(c){
      if(!c) return;
      var d = monthData(c.id, mk);
      if(!d.R && !d.A.length && !d.B.length) return;
      var aoa = [[c.name+' — '+monthLong(mk)], ['Invoice no: '+(d.inv||'NOT SET')+'      Invoice date: '+uk(d.cutoff)], []];
      var block = function(title, list, noteFn){
        if(!list.length) return;
        aoa.push([title]); aoa.push(head);
        list.forEach(function(j,i){ aoa.push([i+1, dt(j.rec), j.addr||'', j.uprn||'', j.type||'', j.eng||'', dt(j.comp), j.status||'', j.inv || (j.invsent==='Yes'?'sent':''),
          (j.amt==null||j.amt==='')?'':Math.round(n(j.amt)*100)/100, noteFn(j)]); });
        aoa.push(['','', list.length+' propert'+(list.length===1?'y':'ies'),'','','','','','', Math.round(sum(list,function(j){return j.amt;})*100)/100, '']);
        aoa.push([]);
      };
      block('ON '+monthOnly(mk).toUpperCase()+'’S INVOICE', d.A, function(j){
        var bits = []; if(mkOf(j.rec)!==mk) bits.push('Received '+monthOnly(mkOf(j.rec))+' — carried over');
        if(!isInvoiced(j)) bits.push('NOT ON AN INVOICE'); return bits.join(' · '); });
      block('STILL TO FINISH — goes on this invoice if completed by '+uk(d.cutoff), d.B, function(){ return ''; });
      block('RECEIVED IN '+monthOnly(mk).toUpperCase()+' — ON A LATER INVOICE', d.C, function(j){ return 'On '+monthLong(billMonth(j))+' invoice'; });
      block('NO CHARGE — WORK DONE, NOTHING TO INVOICE', d.N, function(){ return 'No charge'; });
      block('CANCELLED', d.X, function(){ return ''; });
      aoa.push(['TALLY']); aoa.push(['','Invoice No','Properties','','','','','','','Total (£)']);
      d.order.forEach(function(k){ var L = d.groups[k]; aoa.push(['', k || 'NOT ON AN INVOICE', L.length,'','','','','','', Math.round(sum(L,function(j){return j.amt;})*100)/100]); });
      aoa.push(['', 'On this invoice', d.A.length,'','','','','','', Math.round(d.total*100)/100]);
      aoa.push(['', 'Received this month', d.R]);
      aoa.push(['', 'Still to finish', d.B.length]);
      aoa.push(['', 'Moved to a later invoice', d.C.length]);
      if(d.X.length) aoa.push(['', 'Cancelled', d.X.length]);
      if(d.N.length) aoa.push(['', 'No charge (XXXXX)', d.N.length]);
      var ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true, dateNF:'dd/mm/yyyy'});
      ws['!cols'] = [{wch:5},{wch:12},{wch:46},{wch:14},{wch:12},{wch:16},{wch:12},{wch:12},{wch:13},{wch:11},{wch:38}];
      XLSX.utils.book_append_sheet(wb, ws, c.name.slice(0,31).replace(/[\\\/\?\*\[\]:]/g,' '));
    });
    if(!wb.SheetNames.length){ toast('Nothing in this month to download'); return; }
    XLSX.writeFile(wb, ((cid ? conName(cid)+'_' : 'All_contractors_') + monthLong(mk)).replace(/[^\w.-]+/g,'_') + '.xlsx');
    toast('Month downloaded');
  });
}

/* ───────── Find property ───────── */
function viewFind(){
  var q = route.fq || '';
  var h = '<h2 class="page">Find a property</h2><p class="page">Every time a property was logged, with every contractor, plus the invoices it appears on in the invoice app.</p>';
  h += '<div class="bar"><input id="fq" style="font-size:16px;padding:11px 12px" placeholder="e.g. 42 Mellitus, W10 5NN, KELF0022A" value="'+esc(q)+'" oninput="route.fq=this.value;document.getElementById(\'fres\').innerHTML=findResults(this.value)" autocomplete="off"></div>';
  return h + '<div id="fres">'+findResults(q)+'</div>';
}
function findResults(q){
  var qk = addrKey(q), ql = String(q||'').toLowerCase().trim();
  if(!qk) return '<div class="empty-state"><b>Start typing to search</b>'+DB.jobs.length+' jobs across '+DB.contractors.length+' contractors.</div>';
  var groups = {}, order = [];
  DB.jobs.forEach(function(j){
    var hay = addrKey(j.addr)+'|'+String(j.uprn||'').toLowerCase().replace(/\s/g,'')+'|'+String(j.inv||'').toLowerCase();
    if(hay.indexOf(qk)<0 && hay.indexOf(ql)<0) return;
    var k = addrKey(j.addr); if(!groups[k]){ groups[k] = {addr:j.addr, jobs:[]}; order.push(k); } groups[k].jobs.push(j);
  });
  if(!order.length) return '<div class="empty-state"><b>No property matches “'+esc(q)+'”</b>Try just the house number and street, or the postcode.</div>';
  var h = '<div class="mute" style="margin-bottom:8px">'+order.length+' propert'+(order.length===1?'y':'ies')+' found'+(order.length>60?' — showing 60, type more to narrow it down':'')+'</div>';
  order.slice(0,60).forEach(function(k){
    var g = groups[k]; g.jobs.sort(function(a,b){ return (a.rec||'')<(b.rec||'')?-1:1; });
    var invs = IDX.invByKey[k] || [];
    h += '<div class="sgrp"><div class="sgh"><div><div class="sga">'+esc(g.addr)+'</div><div class="mute">'+g.jobs.length+' job'+(g.jobs.length===1?'':'s')+' · total '+fmt(sum(g.jobs,function(j){return j.amt;}))+(g.jobs[0].uprn?' · UPRN '+esc(g.jobs[0].uprn):'')+'</div></div>'+
         (g.jobs.length>1?'<span class="rep" style="align-self:flex-start">LOGGED '+g.jobs.length+' TIMES</span>':'')+'</div>';
    g.jobs.forEach(function(j){
      var iv = invState(j), pm = paperMissing(j);
      h += '<div class="sent" onclick="openJob(\''+j.id+'\')"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<b><span class="cdot" style="background:'+conColor(j.con)+'"></span>'+esc(conName(j.con))+'</b>'+(j.type?'<span class="pill p-grey">'+esc(j.type)+'</span>':'')+statusPill(j.status)+tcdPill(tcdCheck(j))+
        (iv==='Waiting'?'<span class="pill p-amber">Need: '+pm.join(', ')+'</span>':invPill(iv))+payPill(j.pay)+
        '<span style="margin-left:auto;font-weight:800">'+(j.amt!=null?fmt(j.amt):'')+'</span></div>'+
        '<div class="mute" style="margin-top:3px">Received '+(uk(j.rec)||'—')+' · TCD '+(uk(j.tcd)||'—')+' · scheduled '+(uk(j.sch)||'—')+' · completed '+(uk(j.comp)||'—')+
        (j.eng?' · '+esc(j.eng):'')+(j.inv?' · invoice '+esc(j.inv):'')+'</div>'+(j.rem?'<div class="mute">'+esc(j.rem)+'</div>':'')+'</div>';
    });
    if(invs.length) h += '<div style="margin-top:6px">'+invs.map(function(x){ return '<span class="sinv">🧾 Invoice <b>'+esc(x.v.number||'—')+'</b> '+esc(x.v.status||'')+' · '+fmt(x.l.amount)+'</span>'; }).join('')+'</div>';
    h += '</div>';
  });
  return h;
}

function addCon(){ var nm = prompt('Contractor name'); if(!nm) return; var m={}; m[ROOT+'/contractors/'+uid('c')] = {name:nm.trim().toUpperCase(), color:COLORS[DB.contractors.length % COLORS.length], order:DB.contractors.length}; applyUpdate(m, nm+' added'); }
function saveCon(id,k,v){ if(k==='name' && !v.trim()) return; var m={}; m[ROOT+'/contractors/'+id+'/'+k] = k==='name'?v.trim():v; applyUpdate(m,'Saved'); }
function delCon(id){ var m={}; m[ROOT+'/contractors/'+id]=null; applyUpdate(m,'Contractor removed'); }
function saveEngineers(){ var list = val('eng-list').split(/\n/).map(function(s){return s.trim().toUpperCase();}).filter(Boolean); var m={}; m[ROOT+'/engineers'] = list; applyUpdate(m,'Engineers saved'); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }

var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadXLSX(cb){ if(window.XLSX) return cb(); var s=document.createElement('script'); s.src=XLSX_URL; s.onload=cb; s.onerror=function(){ toast('Could not load the Excel reader — check your connection'); }; document.head.appendChild(s); }
var HEAD = {
  'job type':'type','date received':'rec','address':'addr','uprn':'uprn','access key':'key','engineer':'eng','engineer / tech':'eng',
  'tcd':'tcd','scheduled':'sch','scheduled date':'sch','completed':'comp','completion date':'comp','status':'status','visits':'visits','total visits':'visits',
  'photos sent':'photos','pictures sent':'photos','codes sent':'codes','codes approved':'codeok','code approved':'codeok','sor codes':'sor',
  'cert req?':'certreq','cert issued':'cert','cert date':'certdate','invoice no':'inv','invoice sent':'invsent','total (£)':'amt','amount (£)':'amt',
  'payment':'pay','payment status':'pay','remarks':'rem','remarks / notes':'rem','contractor':'contractor','job reference':'jobref','short note':'note','job description':'note'
};
function cellDate(v){
  if(v==null || v==='') return null;
  if(v instanceof Date) return isoOf(new Date(v.getTime() + 12*3600*1000));   // guard against timezone shifts
  if(typeof v==='number' && v>30000 && v<60000){ var d = new Date(Math.round((v-25569)*86400*1000)); return d.toISOString().slice(0,10); }
  var m = /^\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\s*$/.exec(String(v));
  if(m){ var y=+m[3]; if(y<100) y+=2000; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
  return {text:String(v).trim()};
}
function normYN(v){ if(v==null||v==='') return null; var s=String(v).trim().toLowerCase(); if(/^x+$/.test(s)) return 'N/A'; return {yes:'Yes',y:'Yes',no:'No',n:'No','n/a':'N/A',na:'N/A',pending:'Pending'}[s] || null; }
function parseTracker(wb){
  var out = [];
  wb.SheetNames.forEach(function(nm){
    if(/search|dashboard|lists|contacts|how to use|visit log|invoice log|^invoice /i.test(nm)) return;
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[nm], {header:1, raw:true, defval:null, blankrows:false});
    var hi = -1, map = null;
    for(var i=0;i<Math.min(rows.length,10);i++){
      var heads = (rows[i]||[]).map(function(x){ return String(x==null?'':x).trim().toLowerCase(); });
      if(heads.indexOf('address')>-1 || heads.indexOf('job reference')>-1){ hi = i; map = heads.map(function(hh){ return HEAD[hh]||null; }); break; }
    }
    if(hi<0) return;
    var title = String((rows[0]&&rows.slice(0,1)[0].filter(function(x){return x!=null&&String(x).trim()!=='';})[0])||nm).replace(/[⚡]/g,'').replace(/[—-]\s*JOB TRACKER/i,'').trim() || nm;
    var hasAddr = map.indexOf('addr')>-1;
    rows.slice(hi+1).forEach(function(r){
      var j = {}, rem = [];
      map.forEach(function(k,ci){ if(!k) return; var v=r[ci]; if(v==null || v==='' || v===false) return;
        if(k==='jobref'){ if(!hasAddr) k='addr'; else return; }
        if(['rec','tcd','sch','comp','certdate'].indexOf(k)>-1){ var d=cellDate(v); if(d && d.text){ if(!/^x+$/i.test(d.text)) rem.push(d.text); } else j[k]=d; return; }
        if(['photos','codes','codeok','certreq','cert','invsent'].indexOf(k)>-1){ var y=normYN(v); if(y) j[k]=y; else rem.push(String(v)); return; }
        if(k==='amt'){ var x=parseFloat(String(v).replace(/[£,]/g,'')); if(!isNaN(x)) j.amt=Math.round(x*100)/100; else if(!/^x+$/i.test(String(v).trim())) rem.push('Amount: '+v); return; }
        if(k==='note'){ rem.unshift(String(v)); return; }
        if(k==='rem'){ rem.push(String(v)); return; }
        j[k] = String(v).replace(/ /g,' ').replace(/\s+/g,' ').trim();
      });
      if(!j.addr || !/[a-z0-9]/i.test(j.addr)) return;
      if(j.status && STATUSES.indexOf(j.status)<0) { rem.push('Status: '+j.status); delete j.status; }
      if(j.pay && PAYMENTS.indexOf(j.pay)<0) { rem.push('Payment: '+j.pay); delete j.pay; }
      if(j.visits!=null) j.visits = n(j.visits);
      if(j.eng) j.eng = j.eng.toUpperCase().split('/').map(function(t){return t.trim();}).filter(Boolean).join(' / ');
      if(rem.length) j.rem = rem.filter(function(x,i,a){return a.indexOf(x)===i;}).join(' | ');
      j.contractor = j.contractor || title;
      out.push(j);
    });
  });
  return out;
}
var IMP = null;
function readImport(inp){
  var f = inp.files && inp.files[0]; if(!f) return;
  document.getElementById('imp-body').innerHTML = '<div class="hint">Reading '+esc(f.name)+'…</div>';
  loadXLSX(function(){
    var rd = new FileReader();
    rd.onload = function(ev){
      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true});
        var jobs = parseTracker(wb);
        if(!jobs.length){ document.getElementById('imp-body').innerHTML = '<div class="box warn">No jobs found. The sheets need a header row with an “Address” column.</div>'; return; }
        var existing = {}; DB.jobs.forEach(function(j){ existing[conName(j.con).toUpperCase()+'|'+addrKey(j.addr)+'|'+(j.rec||'')] = 1; });
        var dup = 0; jobs.forEach(function(j){ j._dup = !!existing[String(j.contractor).toUpperCase()+'|'+addrKey(j.addr)+'|'+(j.rec||'')]; if(j._dup) dup++; });
        var by = {}; jobs.forEach(function(j){ by[j.contractor] = (by[j.contractor]||0)+1; });
        IMP = jobs;
        document.getElementById('imp-body').innerHTML =
          '<div class="box ok"><b>'+jobs.length+' jobs found</b><br>'+Object.keys(by).map(function(k){ return esc(k)+': '+by[k]; }).join(' · ')+'</div>'+
          (dup?'<div class="box warn">'+dup+' of them are already in the tracker (same contractor, address and date received) and will be skipped.</div>':'')+
          '<button class="btn b-primary" onclick="saveImport()">Import '+(jobs.length-dup)+' jobs</button>';
      }catch(err){ document.getElementById('imp-body').innerHTML = '<div class="box warn">Could not read this file: '+esc(err.message)+'</div>'; }
    };
    rd.readAsArrayBuffer(f);
  });
}
function saveImport(){
  if(!IMP) return;
  var map = {}, byName = {}, order = DB.contractors.length, added = 0, t = Date.now();
  DB.contractors.forEach(function(c){ byName[c.name.toUpperCase()] = c.id; });
  IMP.forEach(function(j, i){
    if(j._dup) return;
    var nm = String(j.contractor).toUpperCase(), cid = byName[nm];
    if(!cid){ cid = uid('c'); byName[nm] = cid; map[ROOT+'/contractors/'+cid] = {name:nm, color:COLORS[order % COLORS.length], order:order++}; }
    var rec = {}; Object.keys(j).forEach(function(k){ if(k!=='contractor' && k!=='_dup' && j[k]!=null) rec[k]=j[k]; });
    rec.con = cid; rec.created = t + i; rec.updated = t;
    map[ROOT+'/jobs/'+uid('j')] = rec; added++;
  });
  IMP = null;
  applyUpdate(map, added+' jobs imported').then(function(){ go({view:'dash'}); });
}
function exportXLSX(list, fname){
  loadXLSX(function(){
    var cols = [['Job Type','type'],['Date Received','rec'],['Address','addr'],['UPRN','uprn'],['Access Key','key'],['Engineer','eng'],['TCD','tcd'],['Scheduled','sch'],['Completed','comp'],
      ['Status','status'],['Visits','visits'],['Photos Sent','photos'],['Codes Sent','codes'],['Codes Approved','codeok'],['SOR Codes','sor'],['Cert Req?','certreq'],['Cert Issued','cert'],
      ['Cert Date','certdate'],['Invoice No','inv'],['Invoice Sent','invsent'],['Total (£)','amt'],['Payment','pay'],['Remarks','rem'],['TCD Check',null],['Paperwork Missing',null],['Invoice?',null]];
    var wb = XLSX.utils.book_new();
    var groups = {}; list.forEach(function(j){ (groups[j.con] = groups[j.con] || []).push(j); });
    DB.contractors.forEach(function(c){
      var L = groups[c.id]; if(!L || !L.length) return;
      L = L.slice().sort(function(a,b){ return (a.created||0)-(b.created||0); });
      var aoa = [[c.name],[],[],cols.map(function(x){return x[0];})];
      L.forEach(function(j){
        var pm = paperMissing(j);
        aoa.push(cols.map(function(x){
          if(!x[1]){ if(x[0]==='TCD Check') return tcdCheck(j); if(x[0]==='Paperwork Missing') return pm ? (pm.length?pm.join(' '):'✓ All in') : ''; return invState(j); }
          var v = j[x[1]]; if(v==null) return '';
          if(['rec','tcd','sch','comp','certdate'].indexOf(x[1])>-1 && /^\d{4}-\d{2}-\d{2}$/.test(v)){ var p=v.split('-'); return new Date(+p[0],+p[1]-1,+p[2],12); }
          return v;
        }));
      });
      var ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true, dateNF:'dd/mm/yyyy'});
      ws['!cols'] = cols.map(function(x){ return {wch: x[1]==='addr'?44 : x[1]==='rem'?45 : 12}; });
      XLSX.utils.book_append_sheet(wb, ws, c.name.slice(0,31).replace(/[\\\/\?\*\[\]:]/g,' '));
    });
    if(!wb.SheetNames.length){ toast('Nothing to export'); return; }
    XLSX.writeFile(wb, fname.replace(/[^\w.-]+/g,'_')+'.xlsx');
    toast('Excel downloaded');
  });
}

/* ───────── misc ───────── */
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='on'; clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},2600); }
function toastUndo(m, restore){
  var t=document.getElementById('toast');
  t.innerHTML = esc(m)+' <button id="undob" style="background:var(--yellow);color:var(--navy);border:0;border-radius:999px;padding:5px 13px;font-weight:800;font-size:12px;margin-left:8px;cursor:pointer">Undo</button>';
  t.className='on'; document.getElementById('undob').onclick=function(){ t.className=''; restore(); };
  clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},9000);
}
function toggleRO(){ var on=!document.body.classList.contains('ro'); document.body.classList.toggle('ro',on); document.getElementById('robtn').textContent='View only: '+(on?'on':'off'); if(on && route.view==='data') go({view:'dash'}); toast(on?'View only — editing hidden on this device':'Editing switched back on'); }
function fatal(title, detail){ document.getElementById('synced').textContent='Not connected'; document.getElementById('app').innerHTML='<div class="empty-state" style="border-color:#fecaca;background:#fff5f5"><b style="color:var(--red)">'+title+'</b>'+detail+'</div>'; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && modalOpen) closeModal(); });

})();
